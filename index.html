<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="天津专升本学习与测评平台：高等数学、英语、信息技术、软件工程专业课，每日学习、巩固练习、阶段测验与公办院校达标分析。">
  <title>津门升本 · 天津专升本学习与测评</title>
  <meta name="theme-color" content="#1d4ed8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231d4ed8%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230ea5e9%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23g%29%22%2F%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20text-anchor%3D%22middle%22%20font-family%3D%22PingFang%20SC%2C%20Microsoft%20YaHei%2C%20sans-serif%22%20font-size%3D%2238%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%3E%E6%B4%A5%3C%2Ftext%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
  <style>
:root {
  --bg: #f4f7fb;
  --bg-glow: #e8f1ff;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --text: #0f172a;
  --text-2: #334155;
  --muted: #64748b;
  --line: #e6ebf2;
  --line-strong: #d5deea;
  --brand: #1d4ed8;
  --brand-2: #0ea5e9;
  --brand-soft: #eff6ff;
  --success: #0f9f6e;
  --success-soft: #e7f8f1;
  --warn: #d97706;
  --warn-soft: #fff7e6;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.1);
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar-w: 252px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}

[data-theme="dark"] {
  --bg: #0b1120;
  --bg-glow: #12203a;
  --panel: #111a2e;
  --panel-2: #0e1729;
  --text: #e8eef9;
  --text-2: #c3cfe2;
  --muted: #94a6c2;
  --line: #22304a;
  --line-strong: #2d3f5d;
  --brand: #5b8cff;
  --brand-2: #38bdf8;
  --brand-soft: #17294a;
  --success: #34d399;
  --success-soft: #102c27;
  --warn: #fbbf24;
  --warn-soft: #2d2412;
  --danger: #f87171;
  --danger-soft: #2e1719;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.42);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  overflow-x: hidden;
  font-family: var(--font);
  background:
    radial-gradient(1100px 620px at 82% -10%, var(--bg-glow), transparent 60%),
    var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

a {
  color: var(--brand);
}

::selection {
  background: rgba(37, 99, 235, 0.18);
}

.app {
  display: flex;
  min-height: 100vh;
}

/* ---------- 侧边栏 ---------- */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 26px 18px 20px;
  border-right: 1px solid var(--line);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  gap: 22px;
  overflow-y: auto;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 6px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 21px;
  font-weight: 700;
  background: linear-gradient(145deg, #1d4ed8, #0ea5e9);
  box-shadow: 0 8px 20px rgba(29, 78, 216, 0.32);
  flex-shrink: 0;
}

.brand-name {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: 0.5px;
}

.brand-sub {
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.4px;
  margin-top: 1px;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text-2);
  padding: 11px 12px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  position: relative;
  transition: background 0.18s ease, color 0.18s ease;
  text-align: left;
}

.nav-item svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  color: var(--muted);
  transition: color 0.18s ease;
}

.nav-item:hover {
  background: var(--panel-2);
  color: var(--text);
}

.nav-item.active {
  background: var(--brand-soft);
  color: var(--brand);
}

.nav-item.active svg {
  color: var(--brand);
}

.nav-item.active::before {
  content: "";
  position: absolute;
  left: -18px;
  top: 9px;
  bottom: 9px;
  width: 3px;
  border-radius: 0 4px 4px 0;
  background: linear-gradient(180deg, var(--brand), var(--brand-2));
}

.sidebar-goal {
  margin-top: auto;
  border: 1px solid var(--line);
  background: linear-gradient(165deg, var(--panel-2), var(--panel));
  border-radius: 14px;
  padding: 14px;
  font-size: 12px;
  color: var(--muted);
}

.sidebar-goal .goal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.sidebar-goal strong {
  font-size: 13px;
  color: var(--text);
}

.sidebar-goal .goal-bar {
  height: 7px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}

.sidebar-goal .goal-bar span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.sidebar-goal .goal-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 7px;
  font-size: 11px;
}

.sidebar-foot {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 6px;
  font-size: 10.5px;
  color: var(--muted);
}

.sidebar-foot .dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--line-strong);
}

/* ---------- 主区域 ---------- */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 72px;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 25;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.mobile-brand {
  display: none;
  font-weight: 800;
  font-size: 15px;
  color: var(--brand);
}

.topbar-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.2px;
  white-space: nowrap;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  padding: 0 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.chip strong {
  font-size: 14px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.chip svg {
  width: 15px;
  height: 15px;
  color: var(--warn);
}

.countdown-chip strong {
  color: var(--brand);
}

.chip-unit {
  font-size: 11px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  transition: color 0.18s, border-color 0.18s, transform 0.18s;
}

.icon-btn:hover {
  color: var(--brand);
  border-color: var(--brand);
  transform: rotate(-8deg);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
}

.view {
  padding: 30px 32px 70px;
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  outline: none;
}

.view > * {
  animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.view > *:nth-child(2) { animation-delay: 0.04s; }
.view > *:nth-child(3) { animation-delay: 0.08s; }
.view > *:nth-child(4) { animation-delay: 0.12s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 通用组件 ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
}

.hero {
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  padding: 30px 34px;
  color: #fff;
  background:
    radial-gradient(600px 300px at 90% -30%, rgba(56, 189, 248, 0.55), transparent 65%),
    linear-gradient(125deg, #0f2e6e 0%, #1d4ed8 52%, #0e7490 100%);
  box-shadow: 0 24px 50px rgba(29, 78, 216, 0.26);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  margin-bottom: 18px;
}

.hero::after {
  content: "";
  position: absolute;
  right: 190px;
  top: -80px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.18);
  pointer-events: none;
}

.hero-copy {
  position: relative;
  z-index: 1;
  max-width: 660px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--brand);
}

.hero .eyebrow {
  color: rgba(255, 255, 255, 0.72);
}

.hero h2 {
  font-size: 28px;
  line-height: 1.35;
  margin: 10px 0 9px;
  letter-spacing: 0.2px;
}

.hero h2 em {
  font-style: normal;
  color: #7dd3fc;
}

.hero-desc {
  font-size: 13.5px;
  color: rgba(255, 255, 255, 0.76);
  max-width: 560px;
}

.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.hero-ring {
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.hero-ring svg {
  width: 138px;
  height: 138px;
}

.hero-ring .ring-label {
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.7);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid transparent;
  border-radius: 11px;
  padding: 10px 17px;
  font-size: 13.5px;
  font-weight: 650;
  line-height: 1.2;
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, opacity 0.18s;
  white-space: nowrap;
}

.btn:active {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff;
  box-shadow: 0 8px 20px rgba(29, 78, 216, 0.24);
}

.btn-primary:hover {
  box-shadow: 0 12px 26px rgba(29, 78, 216, 0.32);
}

.btn-light {
  background: #fff;
  color: #12306f;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
}

.btn-ghost-light {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.26);
}

.btn-ghost-light:hover,
.btn-light:hover {
  transform: translateY(-1px);
}

.btn-outline {
  background: transparent;
  border-color: var(--line-strong);
  color: var(--text-2);
}

.btn-outline:hover {
  border-color: var(--brand);
  color: var(--brand);
  background: var(--brand-soft);
}

.btn-soft {
  background: var(--brand-soft);
  color: var(--brand);
}

.btn-danger {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: transparent;
}

.btn-sm {
  padding: 8px 13px;
  font-size: 12.5px;
  border-radius: 9px;
}

.btn-block {
  width: 100%;
}

.text-link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--brand);
  font-size: 12.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.text-link:hover {
  text-decoration: underline;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin: 26px 2px 13px;
}

.section-head h2 {
  font-size: 18px;
  letter-spacing: 0.2px;
}

.section-head p {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 2px;
}

.section-head .text-link {
  flex-shrink: 0;
  padding-bottom: 2px;
}

.grid {
  display: grid;
  gap: 16px;
}

.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 4px;
}

.kpi {
  padding: 17px 18px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  position: relative;
  overflow: hidden;
}

.kpi::after {
  content: "";
  position: absolute;
  right: -22px;
  bottom: -26px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--brand-soft);
  opacity: 0.75;
}

.kpi-label {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}

.kpi strong {
  font-size: 26px;
  letter-spacing: -0.5px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.kpi strong small {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 3px;
}

.kpi-hint {
  font-size: 11px;
  color: var(--muted);
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.subject-card {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  position: relative;
  overflow: hidden;
}

.subject-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--subject, var(--brand));
}

.subject-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.subject-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 700;
  color: var(--subject, var(--brand));
  background: var(--soft, var(--brand-soft));
  flex-shrink: 0;
}

.subject-top h3 {
  font-size: 14.5px;
  line-height: 1.3;
}

.subject-top p {
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 2px;
}

.subject-top .tag {
  margin-left: auto;
  align-self: flex-start;
}

.meter {
  height: 7px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}

.meter > span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--subject, var(--brand));
  transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}

.subject-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
}

.subject-meta b {
  color: var(--text-2);
  font-weight: 650;
}

.subject-card .btn {
  margin-top: auto;
  background: var(--soft, var(--brand-soft));
  color: var(--subject, var(--brand));
  border-color: transparent;
}

.subject-card .btn:hover {
  filter: brightness(0.97);
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 650;
  white-space: nowrap;
}

.tag-soft {
  background: var(--soft, var(--brand-soft));
  color: var(--subject, var(--brand));
  border-color: transparent;
}

.tag-success {
  background: var(--success-soft);
  color: var(--success);
  border-color: transparent;
}

.tag-warn {
  background: var(--warn-soft);
  color: var(--warn);
  border-color: transparent;
}

.tag-danger {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: transparent;
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.task-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 13px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
  text-align: left;
  transition: border-color 0.18s, background 0.18s, transform 0.18s;
}

.task-row:hover {
  border-color: var(--subject, var(--brand));
  background: var(--panel-2);
  transform: translateX(2px);
}

.task-row.done {
  background: var(--panel-2);
  opacity: 0.72;
}

.task-check {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 1.5px solid var(--line-strong);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: transparent;
}

.task-row.done .task-check {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

.task-check svg {
  width: 13px;
  height: 13px;
}

.task-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.task-main strong {
  font-size: 13px;
  font-weight: 650;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-main small {
  font-size: 11px;
  color: var(--muted);
}

.task-side {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--muted);
  flex-shrink: 0;
}

.task-row.done .task-side {
  color: var(--success);
}

.forecast {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.forecast-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.forecast-head span {
  font-size: 12px;
  color: var(--muted);
}

.forecast-head strong {
  display: block;
  margin-top: 4px;
  font-size: 30px;
  letter-spacing: -1px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.forecast-head strong em {
  font-style: normal;
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 4px;
}

.target-meter {
  position: relative;
  height: 12px;
  border-radius: 99px;
  background: var(--line);
  margin-top: 4px;
}

.target-meter .target-fill {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.target-meter .target-fill.near {
  background: linear-gradient(90deg, #0d9488, #34d399);
}

.target-meter .target-line {
  position: absolute;
  top: -5px;
  bottom: -5px;
  width: 2px;
  background: var(--warn);
  border-radius: 2px;
}

.target-meter .target-line::after {
  content: "目标";
  position: absolute;
  top: -19px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9.5px;
  color: var(--warn);
  white-space: nowrap;
}

.forecast-legend {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
}

.mini-bars {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 4px;
}

.mini-bar {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
}

.mini-bar .mb-label {
  width: 58px;
  color: var(--muted);
  flex-shrink: 0;
}

.mini-bar .mb-track {
  flex: 1;
  height: 6px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}

.mini-bar .mb-track span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--subject, var(--brand));
}

.mini-bar .mb-val {
  width: 48px;
  text-align: right;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.callout {
  border: 1px solid var(--line);
  border-left: 3px solid var(--brand);
  background: var(--panel-2);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.65;
}

.callout strong {
  color: var(--text-2);
}

/* ---------- 今日学习 ---------- */
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}

.page-head h2 {
  font-size: 24px;
  letter-spacing: -0.2px;
}

.page-head p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
  max-width: 700px;
}

.day-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 15px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--panel);
  flex-shrink: 0;
}

.day-badge strong {
  font-size: 22px;
  color: var(--brand);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.day-badge span {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.35;
}

.unit-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.unit-card {
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding: 20px;
  border-top: 3px solid var(--subject, var(--brand));
}

.unit-head {
  display: flex;
  align-items: flex-start;
  gap: 11px;
}

.unit-head h3 {
  font-size: 16px;
  line-height: 1.4;
  margin-top: 3px;
}

.unit-head p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.unit-status {
  margin-left: auto;
  font-size: 10.5px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 3px 9px;
  flex-shrink: 0;
}

.unit-status.done {
  color: var(--success);
  background: var(--success-soft);
  border-color: transparent;
}

.points {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.points li {
  position: relative;
  padding-left: 16px;
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1.65;
}

.points li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--subject, var(--brand));
  opacity: 0.65;
}

.unit-tip {
  font-size: 11.5px;
  color: var(--muted);
  background: var(--panel-2);
  border-radius: 10px;
  padding: 10px 12px;
  line-height: 1.6;
}

.unit-tip strong {
  color: var(--subject, var(--brand));
  margin-right: 5px;
}

.unit-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: auto;
}

.unit-actions .btn-primary {
  background: var(--subject, var(--brand));
  box-shadow: none;
}

.daily-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  margin-bottom: 16px;
  border-radius: 15px;
  border: 1px dashed var(--line-strong);
  background: var(--panel-2);
}

.daily-banner .db-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--brand-soft);
  color: var(--brand);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-weight: 800;
}

.daily-banner strong {
  font-size: 13px;
}

.daily-banner p {
  font-size: 12px;
  color: var(--muted);
}

.daily-banner .btn {
  margin-left: auto;
  flex-shrink: 0;
}

/* ---------- 练习 / 测验 ---------- */
.practice-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 26px 28px;
  margin-bottom: 16px;
  background:
    radial-gradient(420px 200px at 100% 0%, rgba(14, 165, 233, 0.16), transparent 70%),
    var(--panel);
}

.practice-hero h2 {
  font-size: 22px;
  margin-bottom: 5px;
}

.practice-hero p {
  color: var(--muted);
  font-size: 12.5px;
  max-width: 560px;
}

.practice-meta {
  display: flex;
  gap: 22px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.practice-meta div {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.practice-meta strong {
  font-size: 20px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.practice-meta span {
  font-size: 10.5px;
  color: var(--muted);
}

.practice-hero .btn {
  flex-shrink: 0;
}

.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.stat-box {
  padding: 15px 16px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--panel);
}

.stat-box span {
  font-size: 11px;
  color: var(--muted);
}

.stat-box strong {
  display: block;
  margin-top: 3px;
  font-size: 20px;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}

.stat-box strong small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}

.quiz-shell {
  max-width: 880px;
  margin: 0 auto;
  padding: 26px 30px;
}

.quiz-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
}

.quiz-head .quiz-index {
  font-weight: 650;
  color: var(--text-2);
}

.quiz-progress {
  height: 5px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin: 10px 0 22px;
}

.quiz-progress span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
  transition: width 0.3s ease;
}

.quiz-stem {
  font-size: 16px;
  line-height: 1.75;
  font-weight: 600;
  margin-bottom: 18px;
  white-space: pre-line;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.option {
  display: flex;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  align-items: flex-start;
  gap: 11px;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--panel);
  cursor: pointer;
  transition: border-color 0.16s, background 0.16s;
  font-size: 13.5px;
  line-height: 1.6;
}

.option:hover {
  border-color: var(--line-strong);
  background: var(--panel-2);
}

.option:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.option-key {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--panel-2);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
  margin-top: 1px;
}

.option.selected {
  border-color: var(--brand);
  background: var(--brand-soft);
}

.option.selected .option-key {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.option.correct {
  border-color: var(--success);
  background: var(--success-soft);
}

.option.correct .option-key {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

.option.wrong {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.option.wrong .option-key {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}

.option.show-correct {
  border-color: var(--success);
  border-style: dashed;
}

.quiz-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}

.quiz-actions .spacer {
  flex: 1;
}

.quiz-palette {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.palette-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 650;
  transition: all 0.15s;
}

.palette-btn.answered {
  background: var(--brand-soft);
  border-color: var(--brand);
  color: var(--brand);
}

.palette-btn.current {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.palette-legend {
  display: flex;
  gap: 14px;
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 12px;
  flex-wrap: wrap;
}

.palette-legend i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 3px;
  margin-right: 4px;
  vertical-align: 1px;
}

.exam-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.exam-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--muted);
  flex-wrap: wrap;
}

.exam-title strong {
  color: var(--text);
  font-size: 15px;
}

.timer {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 9px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}

.timer.warn {
  color: var(--danger);
  border-color: var(--danger);
  background: var(--danger-soft);
}

.exam-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  gap: 16px;
  align-items: start;
}

.exam-main {
  padding: 26px 30px;
}

.exam-side {
  position: sticky;
  top: 92px;
  padding: 18px;
}

.exam-side h3 {
  font-size: 13px;
  margin-bottom: 12px;
}

.exam-side .btn {
  margin-top: 16px;
}

.exam-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
  line-height: 1.6;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.choice {
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 11px;
  padding: 11px 12px;
  text-align: left;
  font-size: 12.5px;
  transition: all 0.16s;
}

.choice .choice-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--subject, var(--line-strong));
  flex-shrink: 0;
}

.choice:hover {
  border-color: var(--line-strong);
  background: var(--panel-2);
}

.choice.active {
  border-color: var(--brand);
  background: var(--brand-soft);
}

.choice small {
  display: block;
  color: var(--muted);
  font-size: 10px;
}

.exam-config {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.config-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  font-size: 12.5px;
  color: var(--muted);
}

.config-row strong {
  color: var(--text);
  font-size: 14px;
}

.result-hero {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 28px 30px;
  margin-bottom: 16px;
  overflow: hidden;
  position: relative;
}

.result-hero::after {
  content: "";
  position: absolute;
  right: -40px;
  top: -60px;
  width: 210px;
  height: 210px;
  border-radius: 50%;
  background: var(--brand-soft);
  opacity: 0.6;
}

.result-ring {
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

.result-ring svg {
  width: 132px;
  height: 132px;
}

.result-copy {
  position: relative;
  z-index: 1;
}

.result-copy h2 {
  font-size: 26px;
  letter-spacing: -0.5px;
}

.result-copy > p {
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 4px;
}

.result-metrics {
  display: flex;
  gap: 26px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.result-metrics div {
  display: flex;
  flex-direction: column;
}

.result-metrics strong {
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}

.result-metrics span {
  font-size: 10.5px;
  color: var(--muted);
}

.review-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.review-item {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  padding: 16px 18px;
}

.review-item.is-correct {
  border-left: 3px solid var(--success);
}

.review-item.is-wrong {
  border-left: 3px solid var(--danger);
}

.review-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 7px;
}

.review-item .review-stem {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.7;
  white-space: pre-line;
}

.review-answer {
  margin-top: 9px;
  font-size: 12px;
  color: var(--text-2);
}

.review-answer .wrong-text {
  color: var(--danger);
  font-weight: 600;
}

.review-answer .right-text {
  color: var(--success);
  font-weight: 600;
}

.explain {
  margin-top: 9px;
  padding: 10px 12px;
  border-radius: 9px;
  background: var(--panel-2);
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.65;
}

.explain strong {
  color: var(--text-2);
}

/* ---------- 学情分析 ---------- */
.chart-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 16px;
}

.chart-card {
  padding: 20px 22px;
}

.chart-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.chart-head h3 {
  font-size: 14.5px;
}

.chart-head p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.chart-wrap {
  width: 100%;
}

.chart-wrap svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

.chart-empty {
  height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 20px;
}

.mastery-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 6px;
}

.mastery-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mastery-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
}

.mastery-top b {
  font-size: 13.5px;
}

.mastery-top span {
  color: var(--muted);
  font-size: 11px;
}

.mastery-bar {
  height: 8px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}

.mastery-bar span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--subject, var(--brand));
  transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}

.mastery-hint {
  font-size: 10.5px;
  color: var(--muted);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.table th {
  text-align: left;
  font-size: 10.5px;
  color: var(--muted);
  font-weight: 600;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.table td {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--text-2);
}

.table tr:last-child td {
  border-bottom: 0;
}

.table .score {
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.wrong-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.wrong-item {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 14px;
  background: var(--panel);
}

.wrong-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}

.wrong-top strong {
  font-size: 12px;
  font-weight: 650;
}

.wrong-item p {
  font-size: 12.5px;
  line-height: 1.65;
  white-space: pre-line;
}

.wrong-item .wrong-answer {
  margin-top: 7px;
  font-size: 11.5px;
  color: var(--muted);
}

.wrong-item .explain {
  margin-top: 8px;
}

.empty {
  padding: 38px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 12.5px;
  border: 1px dashed var(--line);
  border-radius: 13px;
}

.empty strong {
  display: block;
  color: var(--text-2);
  font-size: 14px;
  margin-bottom: 4px;
}

/* ---------- 设置 ---------- */
.settings-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 16px;
  align-items: start;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field.full {
  grid-column: 1 / -1;
}

.field label {
  font-size: 11.5px;
  font-weight: 650;
  color: var(--text-2);
}

.field input,
.field select {
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  padding: 0 12px;
  font-size: 13px;
  transition: border-color 0.16s, box-shadow 0.16s;
}

.field input:focus,
.field select:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}

.field small {
  font-size: 10.5px;
  color: var(--muted);
}

.form-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;

  <script>
(function () {
  "use strict";

  const STORAGE_KEY = "jinmen-upgrade-v1";
  const LETTERS = ["A", "B", "C", "D", "E", "F"];
  const VIEW_TITLES = {
    dashboard: "学习总览",
    today: "今日学习",
    practice: "每日巩固",
    exam: "阶段测验",
    analysis: "学情分析",
    settings: "设置"
  };
  const NAV_ORDER = ["dashboard", "today", "practice", "exam", "analysis", "settings"];

  const SUBJECT_MAP = {};
  SUBJECTS.forEach(function (s) { SUBJECT_MAP[s.id] = s; });
  const UNIT_MAP = {};
  UNITS.forEach(function (u) { UNIT_MAP[u.id] = u; });
  const QUESTION_MAP = {};
  QUESTIONS.forEach(function (q) { QUESTION_MAP[q.id] = q; });
  const SCHOOL_MAP = {};
  SCHOOLS.forEach(function (s) { SCHOOL_MAP[s.id] = s; });
  const STAGE_MAP = {};
  STAGES.forEach(function (s) { STAGE_MAP[s.id] = s; });

  let examTimerId = null;
  let toastTimer = null;

  let ui = {
    view: "dashboard",
    examConfig: { subject: "math", stage: "basic" },
    practice: null,
    exam: null,
    examResult: null
  };

  let state = loadState();

  /* ---------- 基础工具 ---------- */
  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function dateKey(d) {
    const date = d || new Date();
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
  }

  function parseDate(key) {
    return new Date(key + "T00:00:00");
  }

  function shiftDate(key, delta) {
    const d = parseDate(key);
    d.setDate(d.getDate() + delta);
    return dateKey(d);
  }

  function daysBetween(a, b) {
    return Math.round((parseDate(a) - parseDate(b)) / 86400000);
  }

  function chineseDate(key) {
    const d = parseDate(key);
    const weeks = ["日", "一", "二", "三", "四", "五", "六"];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 周" + weeks[d.getDay()];
  }

  function defaultExamDate() {
    const now = new Date();
    let y = now.getFullYear();
    const target = new Date(y, 2, 13);
    if (target < new Date(now.getFullYear(), now.getMonth(), now.getDate())) y += 1;
    return y + "-03-13";
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function round(n) {
    return Math.round(n);
  }

  function sum(list, key) {
    return list.reduce(function (acc, item) { return acc + (item[key] || 0); }, 0);
  }

  function shuffle(list) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function todayKey() {
    return dateKey(new Date());
  }

  function greeting() {
    const h = new Date().getHours();
    if (h < 6) return "凌晨好";
    if (h < 11) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }

  /* ---------- 状态存取 ---------- */
  function defaultState() {
    return {
      version: 1,
      profile: {
        name: "同学",
        examDate: defaultExamDate(),
        schoolId: "tjut",
        dailyMinutes: 120,
        theme: "light"
      },
      completed: { math: [], english: [], it: [], se: [] },
      dailyLog: {},
      practiceLog: [],
      exams: [],
      wrongs: [],
      streak: { last: "", days: 0 },
      startedAt: todayKey()
    };
  }

  function normalizeState(raw) {
    const def = defaultState();
    if (!raw || typeof raw !== "object") return def;
    const result = Object.assign({}, def, raw);
    result.profile = Object.assign({}, def.profile, raw.profile || {});
    if (!SCHOOL_MAP[result.profile.schoolId]) result.profile.schoolId = "tjut";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(result.profile.examDate || "")) {
      result.profile.examDate = def.profile.examDate;
    }
    if (!["light", "dark"].includes(result.profile.theme)) result.profile.theme = "light";
    result.completed = Object.assign({}, def.completed, raw.completed || {});
    SUBJECTS.forEach(function (s) {
      if (!Array.isArray(result.completed[s.id])) result.completed[s.id] = [];
      result.completed[s.id] = result.completed[s.id].filter(function (id) { return !!UNIT_MAP[id]; });
    });
    result.dailyLog = raw.dailyLog && typeof raw.dailyLog === "object" ? raw.dailyLog : {};
    Object.keys(result.dailyLog).forEach(function (key) {
      const entry = result.dailyLog[key];
      if (!entry || typeof entry !== "object") {
        delete result.dailyLog[key];
        return;
      }
      entry.units = Array.isArray(entry.units) ? entry.units.filter(function (id) { return !!UNIT_MAP[id]; }) : [];
      entry.doneUnits = Array.isArray(entry.doneUnits) ? entry.doneUnits.filter(function (id) { return !!UNIT_MAP[id]; }) : [];
      if (!("quiz" in entry)) entry.quiz = null;
      if (entry.quiz && (typeof entry.quiz.correct !== "number" || typeof entry.quiz.total !== "number")) entry.quiz = null;
    });
    result.practiceLog = Array.isArray(raw.practiceLog) ? raw.practiceLog.filter(function (x) {
      return x && SUBJECT_MAP[x.subject] && typeof x.correct === "number" && typeof x.total === "number";
    }).map(function (x) {
      return {
        date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || "") ? x.date : todayKey(),
        subject: x.subject,
        correct: x.correct,
        total: x.total,
        source: x.source || "practice"
      };
    }) : [];
    result.exams = Array.isArray(raw.exams) ? raw.exams.filter(function (x) {
      return x && SUBJECT_MAP[x.subject] && typeof x.score === "number";
    }).map(function (x) {
      const qids = Array.isArray(x.qids) ? x.qids.filter(function (id) { return !!QUESTION_MAP[id]; }) : [];
      return {
        id: x.id || "exam-" + Math.random().toString(36).slice(2, 10),
        date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || "") ? x.date : todayKey(),
        subject: x.subject,
        stage: STAGE_MAP[x.stage] ? x.stage : "basic",
        score: clamp(Number(x.score) || 0, 0, 100),
        correct: Number(x.correct) || 0,
        totalQ: Number(x.totalQ) || qids.length || 10,
        timeUsed: Number(x.timeUsed) || 0,
        qids: qids,
        answers: x.answers && typeof x.answers === "object" ? x.answers : {}
      };
    }) : [];
    result.wrongs = Array.isArray(raw.wrongs) ? raw.wrongs.filter(function (x) {
      return x && QUESTION_MAP[x.qid];
    }).map(function (x) {
      return {
        qid: x.qid,
        date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || "") ? x.date : todayKey(),
        count: Number(x.count) || 1
      };
    }) : [];
    result.streak = Object.assign({ last: "", days: 0 }, raw.streak || {});
    result.startedAt = /^\d{4}-\d{2}-\d{2}$/.test(result.startedAt || "") ? result.startedAt : def.startedAt;
    return result;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return normalizeState(JSON.parse(raw));
    } catch (err) {
      return defaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      showToast("本地保存失败，请检查浏览器存储权限");
    }
  }

  /* ---------- 学习进度计算 ---------- */
  function unitsOf(subjectId) {
    return UNITS.filter(function (u) { return u.subject === subjectId; });
  }

  function completedCount(subjectId) {
    return (state.completed[subjectId] || []).length;
  }

  function completionRate(subjectId) {
    const total = unitsOf(subjectId).length;
    return total ? completedCount(subjectId) / total : 0;
  }

  function totalCompleted() {
    return SUBJECTS.reduce(function (acc, s) { return acc + completedCount(s.id); }, 0);
  }

  function todayEntry() {
    const key = todayKey();
    if (!state.dailyLog[key]) {
      state.dailyLog[key] = {
        units: SUBJECTS.map(function (s) { return nextUnitForSubject(s.id).unit.id; }),
        doneUnits: [],
        quiz: null
      };
      saveState();
    }
    const entry = state.dailyLog[key];
    if (!Array.isArray(entry.units) || !entry.units.length) {
      entry.units = SUBJECTS.map(function (s) { return nextUnitForSubject(s.id).unit.id; });
    }
    if (!Array.isArray(entry.doneUnits)) entry.doneUnits = [];
    return entry;
  }

  function nextUnitForSubject(subjectId) {
    const units = unitsOf(subjectId);
    const done = state.completed[subjectId] || [];
    const remaining = units.filter(function (u) { return done.indexOf(u.id) === -1; });
    if (remaining.length) return { unit: remaining[0], review: false };
    let best = units[0];
    let bestWrong = -1;
    units.forEach(function (u) {
      const ids = QUESTIONS.filter(function (q) { return q.unit === u.id; }).map(function (q) { return q.id; });
      const wrong = state.wrongs.filter(function (w) { return ids.indexOf(w.qid) !== -1; })
        .reduce(function (acc, w) { return acc + (w.count || 1); }, 0);
      if (wrong > bestWrong) {
        bestWrong = wrong;
        best = u;
      }
    });
    return { unit: best, review: true };
  }

  function stageOfSubject(subjectId) {
    const r = completionRate(subjectId);
    if (r < 0.34) return STAGE_MAP.basic;
    if (r < 0.67) return STAGE_MAP.strong;
    return STAGE_MAP.sprint;
  }

  function subjectStats(subjectId) {
    const logs = state.practiceLog.filter(function (x) { return x.subject === subjectId; });
    const exams = state.exams.filter(function (x) { return x.subject === subjectId; });
    const pTotal = sum(logs, "total");
    const pCorrect = sum(logs, "correct");
    const eTotal = sum(exams, "totalQ") || sum(exams, "total");
    const eCorrect = sum(exams, "correct");
    return {
      practiceTotal: pTotal,
      practiceCorrect: pCorrect,
      practiceRate: pTotal ? pCorrect / pTotal : 0,
      examCount: exams.length,
      examRate: exams.length ? exams.reduce(function (acc, e) { return acc + e.score / 100; }, 0) / exams.length : 0,
      examAvg: exams.length ? round(exams.reduce(function (acc, e) { return acc + e.score; }, 0) / exams.length) : null
    };
  }

  function masteryRate(subjectId) {
    const stats = subjectStats(subjectId);
    return 0.3 * completionRate(subjectId) + 0.4 * stats.practiceRate + 0.3 * stats.examRate;
  }

  function masteryOf(subjectId) {
    return clamp(round(masteryRate(subjectId) * 100), 0, 100);
  }

  function hasEvidence(subjectId) {
    const st = subjectStats(subjectId);
    return st.practiceTotal > 0 || st.examCount > 0;
  }

  function forecast() {
    const ready = state.practiceLog.length > 0 || state.exams.length > 0;
    const rows = SUBJECTS.map(function (s) {
      return {
        subject: s,
        score: Math.round(s.full * masteryRate(s.id)),
        rate: masteryRate(s.id)
      };
    });
    return {
      ready: ready,
      rows: rows,
      total: rows.reduce(function (acc, r) { return acc + r.score; }, 0)
    };
  }

  function overallAccuracy() {
    const pTotal = sum(state.practiceLog, "total");
    const pCorrect = sum(state.practiceLog, "correct");
    const eTotal = state.exams.reduce(function (acc, e) { return acc + (e.totalQ || 10); }, 0);
    const eCorrect = sum(state.exams, "correct");
    const total = pTotal + eTotal;
    return total ? round((pCorrect + eCorrect) / total * 100) : null;
  }

  function totalAnswered() {
    return sum(state.practiceLog, "total") + state.exams.reduce(function (acc, e) { return acc + (e.totalQ || 10); }, 0);
  }

  function effectiveStreak() {
    const today = todayKey();
    if (state.streak.last === today || state.streak.last === shiftDate(today, -1)) {
      return state.streak.days || 0;
    }
    return 0;
  }

  function touchStreak() {
    const today = todayKey();
    if (state.streak.last === today) return;
    if (state.streak.last === shiftDate(today, -1)) {
      state.streak.days = (state.streak.days || 0) + 1;
    } else {
      state.streak.days = 1;
    }
    state.streak.last = today;
  }

  function examDaysLeft() {
    return daysBetween(state.profile.examDate, todayKey());
  }

  function studyDay() {
    return Math.max(1, daysBetween(todayKey(), state.startedAt) + 1);
  }

  /* ---------- 学习动作 ---------- */
  function completeUnit(unitId) {
    const unit = UNIT_MAP[unitId];
    if (!unit) return;
    const entry = todayEntry();
    if (entry.doneUnits.indexOf(unitId) !== -1) {
      showToast("这个单元今天已经完成啦");
      return;
    }
    entry.doneUnits.push(unitId);
    if ((state.completed[unit.subject] || []).indexOf(unitId) === -1) {
      state.completed[unit.subject].push(unitId);
    }
    touchStreak();
    saveState();
    const isReview = (state.completed[unit.subject] || []).length === unitsOf(unit.subject).length;
    showToast(isReview ? "已完成复习，记得做巩固题" : "单元已学完，继续下一个");
    render();
  }

  function recordPracticeResult(result) {
    const bySubject = {};
    result.details.forEach(function (d) {
      const q = QUESTION_MAP[d.qid];
      if (!q) return;
      if (!bySubject[q.subject]) bySubject[q.subject] = { correct: 0, total: 0 };
      bySubject[q.subject].total += 1;
      if (d.correct) bySubject[q.subject].correct += 1;
    });
    const now = todayKey();
    Object.keys(bySubject).forEach(function (sid) {
      state.practiceLog.push({
        date: now,
        subject: sid,
        correct: bySubject[sid].correct,
        total: bySubject[sid].total,
        source: result.mode
      });
    });
  }

  function recordWrongs(details) {
    details.forEach(function (d) {
      const q = QUESTION_MAP[d.qid];
      if (!q) return;
      const idx = state.wrongs.findIndex(function (w) { return w.qid === d.qid; });
      if (d.correct) {
        if (idx !== -1) state.wrongs.splice(idx, 1);
      } else if (idx !== -1) {
        state.wrongs[idx].count = (state.wrongs[idx].count || 1) + 1;
        state.wrongs[idx].date = todayKey();
      } else {
        state.wrongs.push({ qid: d.qid, date: todayKey(), count: 1 });
      }
    });
  }

  function buildDetails(qids, answers) {
    return qids.map(function (qid) {
      const q = QUESTION_MAP[qid];
      const chosen = answers[qid];
      return {
        qid: qid,
        chosen: typeof chosen === "number" ? chosen : null,
        correct: chosen === q.answer
      };
    });
  }

  /* ---------- 练习流程 ---------- */
  function buildDailyPractice() {
    const entry = todayEntry();
    const picked = [];
    SUBJECTS.forEach(function (s) {
      const unitId = entry.units.find(function (id) {
        return UNIT_MAP[id] && UNIT_MAP[id].subject === s.id;
      });
      let pool = unitId ? QUESTIONS.filter(function (q) { return q.unit === unitId; }) : [];
      const need = 3 - pool.length;
      if (need > 0) {
        const stageId = unitId && UNIT_MAP[unitId] ? UNIT_MAP[unitId].stage : null;
        const exclude = pool.map(function (q) { return q.id; }).concat(picked);
        let extra = QUESTIONS.filter(function (q) {
          return q.subject === s.id && q.stage === stageId && exclude.indexOf(q.id) === -1;
        });
        if (extra.length < need) {
          const more = QUESTIONS.filter(function (q) {
            return q.subject === s.id && exclude.indexOf(q.id) === -1 &&
              extra.map(function (x) { return x.id; }).indexOf(q.id) === -1;
          });
          extra = extra.concat(shuffle(more));
        }
        pool = pool.concat(shuffle(extra).slice(0, need));
      }
      picked.push.apply(picked, shuffle(pool).slice(0, 3).map(function (q) { return q.id; }));
    });
    return shuffle(picked);
  }

  function buildSubjectPractice(subjectId) {
    return shuffle(QUESTIONS.filter(function (q) { return q.subject === subjectId; }))
      .slice(0, 6).map(function (q) { return q.id; });
  }

  function buildUnitPractice(unitId) {
    return shuffle(QUESTIONS.filter(function (q) { return q.unit === unitId; }))
      .map(function (q) { return q.id; });
  }

  function startPractice(mode, options) {
    const opts = options || {};
    let qids = [];
    if (mode === "daily") qids = buildDailyPractice();
    if (mode === "subject") qids = buildSubjectPractice(opts.subjectId);
    if (mode === "unit") qids = buildUnitPractice(opts.unitId);
    if (!qids.length) {
      showToast("暂时没有可用题目");
      return;
    }
    ui.practice = {
      mode: mode,
      subjectId: opts.subjectId || null,
      unitId: opts.unitId || null,
      qids: qids,
      answers: {},
      index: 0,
      startedAt: Date.now(),
      submitted: false,
      result: null
    };
    ui.view = "practice";
    if (location.hash === "#practice") {
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      location.hash = "practice";
    }
  }

  function submitPractice() {
    const p = ui.practice;
    if (!p || p.submitted) return;
    const unanswered = p.qids.filter(function (qid) {
      return typeof p.answers[qid] !== "number";
    });
    if (unanswered.length) {
      showToast("还有 " + unanswered.length + " 道题未作答，请先完成");
      return;
    }
    const details = buildDetails(p.qids, p.answers);
    const correct = details.filter(function (d) { return d.correct; }).length;
    const result = {
      mode: p.mode,
      details: details,
      correct: correct,
      total: details.length,
      timeUsed: Math.max(1, round((Date.now() - p.startedAt) / 60000))
    };
    recordPracticeResult(result);
    recordWrongs(details);
    touchStreak();
    if (p.mode === "daily") {
      const entry = todayEntry();
      entry.quiz = { correct: correct, total: details.length, at: todayKey() };
    }
    saveState();
    p.result = result;
    p.submitted = true;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- 测验流程 ---------- */
  function startExam() {
    const subjectId = ui.examConfig.subject;
    const stageId = ui.examConfig.stage;
    let pool = QUESTIONS.filter(function (q) { return q.subject === subjectId && q.stage === stageId; });
    if (pool.length < 10) {
      const extra = QUESTIONS.filter(function (q) {
        return q.subject === subjectId && q.stage !== stageId &&
          pool.map(function (p) { return p.id; }).indexOf(q.id) === -1;
      });
      pool = pool.concat(shuffle(extra).slice(0, 10 - pool.length));
    }
    const qids = shuffle(pool).slice(0, 10).map(function (q) { return q.id; });
    if (qids.length < 10) {
      showToast("该阶段题目不足，请切换其他阶段");
      return;
    }
    ui.examResult = null;
    ui.exam = {
      subject: subjectId,
      stage: stageId,
      qids: qids,
      answers: {},
      index: 0,
      startedAt: Date.now(),
      duration: 15 * 60,
      result: null
    };
    ui.view = "exam";
    if (location.hash === "#exam") {
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      location.hash = "exam";
    }
  }

  function submitExam(auto) {
    const exam = ui.exam;
    if (!exam) return;
    const unanswered = exam.qids.filter(function (qid) {
      return typeof exam.answers[qid] !== "number";
    });
    if (!auto) {
      const message = unanswered.length
        ? "还有 " + unanswered.length + " 道题未作答，确定交卷吗？"
        : "确定交卷并查看解析吗？";
      if (!window.confirm(message)) return;
      if (unanswered.length) {
        const sure = window.confirm("未作答的题目将按错误计分，仍要交卷吗？");
        if (!sure) return;
      }
    }
    const details = buildDetails(exam.qids, exam.answers);
    const correct = details.filter(function (d) { return d.correct; }).length;
    const timeUsed = Math.min(exam.duration, Math.max(1, Math.round((Date.now() - exam.startedAt) / 1000)));
    const record = {
      id: "exam-" + Date.now(),
      date: todayKey(),
      subject: exam.subject,
      stage: exam.stage,
      score: correct * 10,
      correct: correct,
      totalQ: details.length,
      timeUsed: timeUsed,
      qids: exam.qids.slice(),
      answers: Object.assign({}, exam.answers)
    };
    state.exams.push(record);
    recordWrongs(details);
    touchStreak();
    saveState();
    ui.exam = null;
    clearInterval(examTimerId);
    ui.examResult = buildExamResult(record);
    render();
    showToast(auto ? "考试时间到，已自动交卷" : "已完成交卷，查看解析");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function buildExamResult(record) {
    const details = buildDetails(record.qids, record.answers);
    return {
      record: record,
      details: details,
      score: record.score,
      correct: record.correct,
      total: record.totalQ || record.qids.length,
      timeUsed: record.timeUsed
    };
  }

  function openExamRecord(id) {
    const record = state.exams.find(function (e) { return e.id === id; });
    if (!record) return;
    ui.examResult = buildExamResult(record);
    ui.view = "exam";
    if (location.hash === "#exam") {
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      location.hash = "exam";
    }
  }

  /* ---------- 启动计时器 ---------- */
  function formatClock(seconds) {
    const s = Math.max(0, seconds);
    return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  }

  function startExamTimer() {
    clearInterval(examTimerId);
    function tick() {
      if (!ui.exam || ui.view !== "exam") {
        clearInterval(examTimerId);
        return;
      }
      const left = Math.max(0, ui.exam.duration - Math.floor((Date.now() - ui.exam.startedAt) / 1000));
      const el = document.getElementById("examTimer");
      if (el) {
        el.textContent = formatClock(left);
        el.classList.toggle("warn", left <= 180);
      }
      if (left <= 0) {
        clearInterval(examTimerId);
        submitExam(true);
      }
    }
    tick();
    examTimerId = setInterval(tick, 1000);
  }

  /* ---------- 通用 UI ---------- */
  function showToast(message) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

    document.documentElement.dataset.theme = state.profile.theme === "dark" ? "dark" : "light";
    const btn = document.getElementById("themeBtn");
    if (btn) {
      btn.setAttribute("aria-label", state.profile.theme === "dark" ? "切换浅色模式" : "切换深色模式");
      btn.title = state.profile.theme === "dark" ? "切换浅色模式" : "切换深色模式";

  }

  function navigate(view) {

      ui.view = view;

  /* ---------- 图表 ---------- */
  function ringHTML(pct, size, color, label, track) {
    const r = 52;
    const c = 2 * Math.PI * r;
    const value = clamp(round(pct), 0, 100);
    const offset = c * (1 - value / 100);
    return '<div class="ring-wrap" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + (track || "var(--line)") + '" stroke-width="9"></circle>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" transform="rotate(-90 60 60)"></circle>' +
      "</svg>" +
      '<div class="ring-center"><strong>' + value + '%</strong><span>' + esc(label) + "</span></div>" +
      "</div>";
  }

  function radarChart() {
    const cx = 160;
    const cy = 134;
    const R = 86;
    const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
    const labels = SUBJECTS.map(function (s) { return s.short; });
    let svg = '<svg viewBox="0 0 320 282" role="img" aria-label="四科掌握度雷达图">';
    [0.25, 0.5, 0.75, 1].forEach(function (k) {
      const pts = angles.map(function (a) {
        return (cx + R * k * Math.cos(a)).toFixed(1) + "," + (cy + R * k * Math.sin(a)).toFixed(1);
      }).join(" ");
      svg += '<polygon points="' + pts + '" fill="none" stroke="var(--line)" stroke-width="1"></polygon>';
    });
    angles.forEach(function (a) {
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(a)).toFixed(1) +
        '" y2="' + (cy + R * Math.sin(a)).toFixed(1) + '" stroke="var(--line)" stroke-width="1"></line>';
    });
    const values = SUBJECTS.map(function (s) { return masteryOf(s.id) / 100; });
    const points = angles.map(function (a, i) {
      return (cx + R * values[i] * Math.cos(a)).toFixed(1) + "," + (cy + R * values[i] * Math.sin(a)).toFixed(1);
    }).join(" ");
    svg += '<polygon points="' + points + '" fill="rgba(37,99,235,0.16)" stroke="var(--brand)" stroke-width="2"></polygon>';
    SUBJECTS.forEach(function (s, i) {
      const x = (cx + R * values[i] * Math.cos(angles[i])).toFixed(1);
      const y = (cy + R * values[i] * Math.sin(angles[i])).toFixed(1);
      svg += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="var(--brand)" stroke="var(--panel)" stroke-width="1.5"></circle>';
    });
    const labelPos = [
      [cx, cy - R - 18, "middle"],
      [cx + R + 30, cy + 4, "start"],
      [cx, cy + R + 26, "middle"],
      [cx - R - 30, cy + 4, "end"]
    ];
    SUBJECTS.forEach(function (s, i) {
      const pos = labelPos[i];
      svg += '<text x="' + pos[0] + '" y="' + pos[1] + '" text-anchor="' + pos[2] +
        '" font-size="11" font-weight="600" fill="var(--text-2)">' + esc(labels[i]) + "</text>";
      svg += '<text x="' + pos[0] + '" y="' + (pos[1] + 14) + '" text-anchor="' + pos[2] +
        '" font-size="10" fill="var(--muted)">' + masteryOf(s.id) + "%</text>";
    });
    svg += "</svg>";
    return svg;
  }

  function lineChart(points) {
    if (!points.length) return "";
    const W = 520;
    const H = 230;
    const left = 40;
    const right = 16;
    const top = 22;
    const bottom = 38;
    const plotW = W - left - right;
    const plotH = H - top - bottom;
    const n = points.length;
    const xOf = function (i) {
      return n === 1 ? left + plotW / 2 : left + plotW * i / (n - 1);
    };
    const yOf = function (v) {
      return top + plotH * (1 - clamp(v, 0, 100) / 100);
    };
    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="成绩趋势图">';
    [0, 25, 50, 75, 100].forEach(function (v) {
      const y = yOf(v);
      svg += '<line x1="' + left + '" y1="' + y + '" x2="' + (W - right) + '" y2="' + y +
        '" stroke="var(--line)" stroke-width="1" stroke-dasharray="' + (v === 0 ? "0" : "3 4") + '"></line>';
      svg += '<text x="' + (left - 8) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="9" fill="var(--muted)">' + v + "</text>";
    });
    const linePoints = points.map(function (p, i) {
      return xOf(i).toFixed(1) + "," + yOf(p.value).toFixed(1);
    });
    const area = left + "," + yOf(0).toFixed(1) + " " + linePoints.join(" ") + " " +
      (xOf(n - 1)).toFixed(1) + "," + yOf(0).toFixed(1);
    svg += '<polygon points="' + area + '" fill="rgba(37,99,235,0.1)"></polygon>';
    svg += '<polyline points="' + linePoints.join(" ") + '" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>';
    points.forEach(function (p, i) {
      const x = xOf(i);
      const y = yOf(p.value);
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.8" fill="var(--panel)" stroke="var(--brand)" stroke-width="2"></circle>';
      if (n <= 8 || i % 2 === 0 || i === n - 1) {
        svg += '<text x="' + x.toFixed(1) + '" y="' + (H - 18) + '" text-anchor="middle" font-size="9" fill="var(--muted)">' + esc(p.label) + "</text>";
      }
    });
    svg += "</svg>";
    return svg;
  }

      '<section class="card"><div class="task-list">' + taskRows + quizRow + "</div></section>" +

  /* ---------- 今日学习 ---------- */
  function viewToday() {
    const entry = todayEntry();
    const units = entry.units.map(function (id) { return UNIT_MAP[id]; }).filter(Boolean);
    const tip = DAILY_TIPS[(studyDay() - 1) % DAILY_TIPS.length];
    const doneCount = units.filter(function (u) { return entry.doneUnits.indexOf(u.id) !== -1; }).length;
    const quizDone = !!entry.quiz;
    const overall = totalCompleted() / UNITS.length;
    const stage = overall < 0.34 ? STAGE_MAP.basic : overall < 0.67 ? STAGE_MAP.strong : STAGE_MAP.sprint;

    const cards = units.map(function (unit) {
      const s = SUBJECT_MAP[unit.subject];
      const already = (state.completed[unit.subject] || []).indexOf(unit.id) !== -1;
      const doneToday = entry.doneUnits.indexOf(unit.id) !== -1;
      const isReview = !unitsOf(unit.subject).some(function (u) {
        return (state.completed[unit.subject] || []).indexOf(u.id) === -1;
      });
      return '<article class="unit-card card" id="unit-' + unit.id + '" style="--subject:' + s.color + ";--soft:" + s.soft + '">' +
        '<div class="unit-head">' +
        '<span class="subject-icon">' + esc(s.icon) + "</span>" +
        "<div><span class=\"tag tag-soft\">" + esc(STAGE_MAP[unit.stage].name) + (isReview ? " · 二轮复习" : "") + "</span>" +
        "<h3>" + esc(unit.title) + "</h3>" +
        "<p>" + esc(s.name) + " · 建议 25 分钟 · " + QUESTIONS.filter(function (q) { return q.unit === unit.id; }).length + " 道配套题</p></div>" +
        '<span class="unit-status' + (doneToday ? " done" : "") + '">' + (doneToday ? "今日已完成" : already ? "已学 · 可复习" : "待学习") + "</span>" +
        "</div>" +
        '<ul class="points">' + unit.points.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>" +
        '<div class="unit-tip"><strong>学习提示</strong>' + esc(unit.tip) + "</div>" +
        '<div class="unit-actions">' +
        (doneToday

        "</div></article>";

    return '<div class="page-head"><div><h2>今日学习</h2>' +
      "<p>" + chineseDate(todayKey()) + " · 第 " + studyDay() + " 天 · 当前处于" + esc(stage.name) +
      "。按四科轮换推进，学完一个单元再进入下一个，避免跳跃式复习。</p></div>" +
      '<div class="day-badge"><strong>' + doneCount + "/" + units.length + '</strong><span>今日单元<br>已完成</span></div></div>' +
      '<div class="daily-banner"><div class="db-icon">' + String(studyDay()).slice(-2) + "</div>" +
      "<div><strong>今日学习建议</strong><p>" + esc(tip) + "</p></div>" +
      '<button class="btn btn-primary btn-sm" type="button" data-view="practice">' + (quizDone ? "再巩固一次" : "完成每日巩固") + "</button></div>" +
      '<div class="unit-grid">' + cards + "</div>" +
      '<div class="section-head"><div><h2>学习节奏</h2><p>每个单元建议 25 分钟，四个单元约 100 分钟。</p></div></div>' +
      '<div class="grid grid-3">' +
      '<div class="card"><span class="tag tag-soft">基础阶段</span><h3 style="font-size:14px;margin:10px 0 5px">理解概念与公式</h3><p style="font-size:12px;color:var(--muted)">先把知识框架搭起来，配套题只求做对，不求速度。</p></div>' +
      '<div class="card"><span class="tag tag-soft">强化阶段</span><h3 style="font-size:14px;margin:10px 0 5px">专题突破综合题</h3><p style="font-size:12px;color:var(--muted)">把跨知识点题型拆开训练，错题当天复盘。</p></div>' +
      '<div class="card"><span class="tag tag-soft">冲刺阶段</span><h3 style="font-size:14px;margin:10px 0 5px">限时模拟稳得分</h3><p style="font-size:12px;color:var(--muted)">严格计时，优先把会做的题全部拿到分。</p></div>' +
      "</div>";
  }

  /* ---------- 每日巩固 ---------- */
  function viewPractice() {
    if (ui.practice) {
      if (ui.practice.submitted) return viewPracticeResult();
      return viewPracticeQuiz();
    }
    const entry = todayEntry();
    const quiz = entry.quiz;
    const total = sum(state.practiceLog, "total");
    const correct = sum(state.practiceLog, "correct");
    const acc = total ? round(correct / total * 100) : null;
    const todayQuestions = 12;

    const scope = SUBJECTS.map(function (s) {
      const id = entry.units.find(function (uid) { return UNIT_MAP[uid] && UNIT_MAP[uid].subject === s.id; });
      const unit = id ? UNIT_MAP[id] : null;
      return '<div class="school-row" style="--subject:' + s.color + '">' +
        '<span class="subject-icon" style="width:30px;height:30px;font-size:14px">' + esc(s.icon) + "</span>" +
        "<div><strong>" + esc(s.name) + "</strong><p style=\"font-size:10.5px;color:var(--muted)\">" +
        (unit ? esc(unit.title) : "综合复习") + "</p></div>" +
        '<span class="tag">' + (unit ? QUESTIONS.filter(function (q) { return q.unit === unit.id; }).length : 0) + " 题</span>" +
        "</div>";
    }).join("");

    const subjectCards = SUBJECTS.map(function (s) {
      return '<article class="subject-card card" style="--subject:' + s.color + ";--soft:" + s.soft + '">' +
        '<div class="subject-top"><span class="subject-icon">' + esc(s.icon) + "</span>" +
        "<div><h3>" + esc(s.name) + "专项</h3><p>从本科题库随机抽 6 题</p></div></div>" +
        '<div class="subject-meta"><span>已练 <b>' + sum(state.practiceLog.filter(function (x) { return x.subject === s.id; }), "total") +
        "</b> 题</span><span>正确率 <b>" + (function () {
          const logs = state.practiceLog.filter(function (x) { return x.subject === s.id; });
          const t = sum(logs, "total");
          return t ? round(sum(logs, "correct") / t * 100) + "%" : "--";
        })() + "</b></span></div>" +
        '<button class="btn btn-sm" type="button" data-action="practiceSubject" data-id="' + s.id + '">开始专项练习</button>' +
        "</article>";
    }).join("");

    return '<section class="practice-hero card">' +
      "<div><span class=\"eyebrow\">每日巩固</span><h2>" + (quiz ? "今天已经巩固过一轮" : "用 12 道题检验今天的学习") + "</h2>" +
      "<p>题目来自今天四个知识单元，覆盖高数、英语、信息技术与软件工程专业课。提交后立即查看逐题解析，错题会自动进入错题本。</p>" +
      '<div class="practice-meta"><div><strong>' + todayQuestions + "</strong><span>今日题量</span></div>" +
      "<div><strong>约 15</strong><span>分钟</span></div>" +
      "<div><strong>" + (quiz ? quiz.correct + "/" + quiz.total : "--") + "</strong><span>今日成绩</span></div>" +
      "<div><strong>" + (acc == null ? "--" : acc + "%") + "</strong><span>累计正确率</span></div></div></div>" +
      '<button class="btn btn-primary" type="button" data-action="startDaily">' + (quiz ? "再练一轮" : "开始今日巩固") + "</button>" +
      "</section>" +
      '<div class="stat-strip">' +
      '<div class="stat-box"><span>累计答题</span><strong>' + total + "<small> 题</small></strong></div>" +
      '<div class="stat-box"><span>累计答对</span><strong>' + correct + "<small> 题</small></strong></div>" +
      '<div class="stat-box"><span>错题本</span><strong>' + state.wrongs.length + "<small> 题</small></strong></div>" +
      '<div class="stat-box"><span>今日巩固</span><strong>' + (quiz ? quiz.correct + "/" + quiz.total : "待完成") + "</strong></div>" +
      "</div>" +
      '<div class="section-head"><div><h2>今日出题范围</h2><p>每科抽取 3 题，优先覆盖当天单元</p></div></div>' +
      '<div class="card" style="padding:12px"><div class="school-list" style="margin:0">' + scope + "</div></div>" +
      '<div class="section-head"><div><h2>分科专项练习</h2><p>想单独补一科时使用，每次 6 题</p></div></div>' +
      '<div class="subject-grid">' + subjectCards + "</div>" +
      '<p class="footer-note">练习记录会用于计算各科掌握度，建议每天至少完成一次巩固。</p>';
  }

  function viewPracticeQuiz() {
    const p = ui.practice;
    const q = QUESTION_MAP[p.qids[p.index]];
    if (!q) { ui.practice = null; return viewPractice(); }
    const s = SUBJECT_MAP[q.subject];
    const answered = p.qids.filter(function (id) { return typeof p.answers[id] === "number"; }).length;
    const options = q.options.map(function (opt, i) {
      const selected = p.answers[q.id] === i;
      return '<button class="option' + (selected ? " selected" : "") + '" type="button" role="radio" aria-checked="' + selected +
        '" data-action="answer" data-qid="' + q.id + '" data-opt="' + i + '">' +
        '<span class="option-key">' + LETTERS[i] + "</span><span>" + esc(opt) + "</span></button>";
    }).join("");
    const palette = p.qids.map(function (id, i) {
      const cls = i === p.index ? " current" : (typeof p.answers[id] === "number" ? " answered" : "");
      return '<button class="palette-btn' + cls + '" type="button" data-action="practiceJump" data-index="' + i + '">' + (i + 1) + "</button>";
    }).join("");
    const isLast = p.index === p.qids.length - 1;
    return '<div class="exam-topbar"><div class="exam-title">' +
      '<strong>' + (p.mode === "daily" ? "每日巩固" : p.mode === "unit" ? "单元练习" : esc(s.name) + "专项练习") + "</strong>" +
      '<span class="tag tag-soft" style="--subject:' + s.color + '">' + esc(s.name) + " · " + esc(STAGE_MAP[q.stage].name) + "</span>" +
      '<span>已作答 ' + answered + "/" + p.qids.length + "</span></div>" +
      '<button class="btn btn-outline btn-sm" type="button" data-action="exitPractice">退出练习</button></div>' +
      '<div class="quiz-shell card">' +
      '<div class="quiz-head"><span class="quiz-index">第 ' + (p.index + 1) + " / " + p.qids.length + " 题</span>" +
      "<span>" + esc(UNIT_MAP[q.unit] ? UNIT_MAP[q.unit].title : "") + "</span></div>" +
      '<div class="quiz-progress"><span style="width:' + ((p.index + 1) / p.qids.length * 100) + '%"></span></div>' +
      '<h3 class="quiz-stem">' + esc(q.stem) + "</h3>" +
      '<div class="options" role="radiogroup" aria-label="选项">' + options + "</div>" +
      '<div class="quiz-palette">' + palette + "</div>" +
      '<div class="palette-legend"><span><i style="background:var(--brand)"></i>当前题</span><span><i style="background:var(--brand-soft);border:1px solid var(--brand)"></i>已作答</span><span><i style="background:var(--line)"></i>未作答</span></div>' +
      '<div class="quiz-actions">' +
      '<button class="btn btn-outline btn-sm" type="button" data-action="practicePrev"' + (p.index === 0 ? " disabled" : "") + ">上一题</button>" +
      '<button class="btn btn-outline btn-sm" type="button" data-action="practiceNext"' + (isLast ? " disabled" : "") + ">下一题</button>" +
      '<span class="spacer"></span>' +
      '<button class="btn btn-primary" type="button" data-action="submitPractice">提交答卷</button>' +
      "</div></div>" +
      '<p class="footer-note">选择会自动保存。提交后统一判分并展示解析，未答完无法提交。</p>';
  }

  function viewPracticeResult() {
    const p = ui.practice;
    const r = p.result;
    const pct = round(r.correct / r.total * 100);
    const color = pct >= 80 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
    const wrongUnits = {};
    r.details.forEach(function (d) {
      if (d.correct) return;
      const q = QUESTION_MAP[d.qid];
      const unit = UNIT_MAP[q.unit];
      if (unit) wrongUnits[unit.id] = unit;
    });
    const weak = Object.keys(wrongUnits).map(function (id) { return UNIT_MAP[id]; });
    const review = r.details.map(function (d, i) {
      const q = QUESTION_MAP[d.qid];
      const s = SUBJECT_MAP[q.subject];
      const chosenText = d.chosen == null ? "未作答" : LETTERS[d.chosen] + ". " + q.options[d.chosen];
      return '<div class="review-item ' + (d.correct ? "is-correct" : "is-wrong") + '">' +
        '<div class="review-head"><span>第 ' + (i + 1) + " 题 · " + esc(s.short) + " · " + esc(UNIT_MAP[q.unit] ? UNIT_MAP[q.unit].title : "") + "</span>" +
        '<span class="tag ' + (d.correct ? "tag-success" : "tag-danger") + '">' + (d.correct ? "正确" : "错误") + "</span></div>" +
        '<p class="review-stem">' + esc(q.stem) + "</p>" +
        '<div class="review-answer">你的答案：<span class="' + (d.correct ? "right-text" : "wrong-text") + '">' + esc(chosenText) +
        "</span> ｜ 正确答案：<span class=\"right-text\">" + LETTERS[q.answer] + ". " + esc(q.options[q.answer]) + "</span></div>" +
        '<div class="explain"><strong>解析：</strong>' + esc(q.explain) + "</div></div>";
    }).join("");

    return '<section class="result-hero card">' +
      '<div class="result-ring">' + ringHTML(pct, 132, color, "正确率") + "</div>" +
      '<div class="result-copy"><span class="eyebrow">巩固完成</span>' +
      "<h2>" + (p.mode === "daily" ? "每日巩固" : p.mode === "unit" ? "单元练习" : "专项练习") + " · 答对 " + r.correct + "/" + r.total + " 题</h2>" +
      "<p>" + (pct >= 80 ? "掌握得不错，保持这个节奏。" : pct >= 60 ? "基础题基本过关，建议把错题所在单元再看一遍。" : "本次暴露了不少薄弱点，先回到知识点，再做一次巩固。") + "</p>" +
      '<div class="result-metrics"><div><strong>' + pct + '%</strong><span>正确率</span></div>' +
      "<div><strong>" + r.total + "</strong><span>总题数</span></div>" +
      "<div><strong>" + r.timeUsed + "</strong><span>用时（分钟）</span></div>" +
      "<div><strong>" + state.wrongs.length + "</strong><span>错题本总数</span></div></div>" +
      (weak.length ? '<p style="font-size:11.5px;color:var(--muted);margin-top:12px">薄弱单元：' + weak.map(function (u) { return esc(u.title); }).join("、") + "</p>" : "") +
      "</div></section>" +
      '<div class="section-head"><div><h2>逐题解析</h2><p>答错的题已自动加入错题本</p></div>' +
      '<div style="display:flex;gap:8px"><button class="btn btn-outline btn-sm" type="button" data-view="analysis">查看学情</button>' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="exitPractice">返回巩固首页</button></div></div>' +
      '<div class="review-list">' + review + "</div>";
  }

  /* ---------- 阶段测验 ---------- */
  function viewExam() {
    if (ui.examResult) return viewExamResult();
    if (ui.exam) return viewExamTaking();
    return viewExamConfig();
  }

  function viewExamConfig() {
    const cfg = ui.examConfig;

  function viewExamTaking() {
    const exam = ui.exam;

    const stage = STAGE_MAP[exam.stage];

    const left = Math.max(0, exam.duration - Math.floor((Date.now() - exam.startedAt) / 1000));

      '<div class="quiz-progress"><span style="width:' + ((exam.index + 1) / exam.qids.length * 100) + '%"></span></div>' +
      '<h3 class="quiz-stem">' + esc(q.stem) + "</h3>" +
      '<div class="options" role="radiogroup" aria-label="选项">' + options + "</div>" +
      '<div class="quiz-actions">' +
      '<button class="btn btn-outline btn-sm" type="button" data-action="examPrev"' + (exam.index === 0 ? " disabled" : "") + ">上一题</button>" +
      '<button class="btn btn-outline btn-sm" type="button" data-action="examNext"' + (isLast ? " disabled" : "") + ">下一题</button>" +

      "</div></section>" +

      '<div class="palette-legend"><span><i style="background:var(--brand)"></i>当前</span><span><i style="background:var(--brand-soft);border:1px solid var(--brand)"></i>已答</span><span><i style="background:var(--line)"></i>未答</span></div>' +
