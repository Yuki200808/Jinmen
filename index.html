      '<div class="section-head"><div><h2>速查手册</h2><p>考前快速回顾公式、句型和概念</p></div></div>' +
      '<div class="cheat-grid">' + cheatCards + "</div>" +
      '<div class="section-head"><div><h2>单元讲义</h2><p>' + (query ? "搜索“" + esc(query) + "” · " : "") + "共 " + filtered.length + " 份</p></div>" +
      '<span class="tag">' + esc(filter === "all" ? "全部科目" : SUBJECT_MAP[filter].name) + "</span></div>" +
      '<div class="material-grid">' + (cards || empty) + "</div>" +
      '<p class="footer-note">讲义为备考学习资料，题目与解析可在“每日巩固”和“阶段测验”中练习。</p>';
  }

  function viewMaterialReader(unitId) {
    const unit = UNIT_MAP[unitId];
    const m = MATERIALS[unitId];
    if (!unit || !m) { ui.readingUnit = null; return viewMaterials(); }
    const s = SUBJECT_MAP[unit.subject];
    const read = materialIsRead(unitId);
    const list = unitsOf(unit.subject);
    const idx = list.findIndex(function (u) { return u.id === unitId; });
    const prev = idx > 0 ? list[idx - 1] : null;
    const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;

    const sections = (m.sections || []).map(function (sec, i) {
      return '<section class="article-section"><h3><span class="section-index">' + (i + 1) + "</span>" + esc(sec.title) + "</h3>" +
        (sec.intro ? '<p class="article-intro">' + esc(sec.intro) + "</p>" : "") +
        '<ul class="article-points">' + (sec.bullets || []).map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul></section>";
    }).join("");

    const goals = (m.goals || []).map(function (g) { return "<li>" + esc(g) + "</li>"; }).join("");
    const pitfalls = (m.pitfalls || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
    const solution = (m.example && m.example.solution || []).map(function (x, i) {
      return "<li><span class=\"step-index\">" + (i + 1) + "</span>" + esc(x) + "</li>";
    }).join("");

    return '<div class="reader-top"><button class="btn btn-outline btn-sm" type="button" data-action="backMaterials">← 返回资料库</button>' +
      '<div class="reader-actions">' +
      '<button class="btn ' + (read ? "btn-outline" : "btn-primary") + ' btn-sm" type="button" data-action="toggleMaterialRead" data-id="' + unit.id + '">' +
      (read ? "取消已读" : "标记已读") + "</button>" +
      '<button class="btn btn-soft btn-sm" type="button" data-action="practiceUnit" data-id="' + unit.id + '">做配套练习</button>' +
      "</div></div>" +
      '<article class="reader-article card" style="--subject:' + s.color + ";--soft:" + s.soft + '">' +
      '<header class="article-head"><div class="article-tags"><span class="tag tag-soft">' + esc(s.name) + "</span><span class=\"tag\">" +
      esc(STAGE_MAP[unit.stage].name) + '</span><span class="tag">讲义 ' + (idx + 1) + "/" + list.length + "</span></div>" +
      "<h1>" + esc(unit.title) + "</h1><p>" + esc(m.summary) + "</p></header>" +
      '<div class="article-goals"><strong>学完这份讲义，你应该能</strong><ul>' + goals + "</ul></div>" +
      '<div class="article-body">' + sections + "</div>" +
      (m.example ? '<div class="example-box"><div class="example-label">例题</div><h3>' + esc(m.example.question) + "</h3>" +
        '<ol class="example-steps">' + solution + "</ol></div>" : "") +
      '<div class="pitfall-box"><div class="example-label">易错点</div><ul>' + pitfalls + "</ul></div>" +
      '<div class="mnemonic-box"><span>记忆口诀</span><strong>' + esc(m.mnemonic) + "</strong></div>" +
      '<div class="reader-nav">' +
      (prev ? '<button class="btn btn-outline btn-sm" type="button" data-action="openMaterial" data-id="' + prev.id + '">← ' + esc(prev.title) + "</button>" : "<span></span>") +
      (next ? '<button class="btn btn-outline btn-sm" type="button" data-action="openMaterial" data-id="' + next.id + '">' + esc(next.title) + " →</button>" : "<span></span>") +
      "</div></article>" +
      '<p class="footer-note">读完后可以标记已读，再进入配套练习检验掌握情况。</p>';
  }

  function viewCheatsheet(subjectId) {
    const c = CHEATSHEETS[subjectId];
    const s = SUBJECT_MAP[subjectId];
    if (!c || !s) { ui.cheatsheet = null; return viewMaterials(); }
    const groups = c.groups.map(function (g) {
      return '<section class="cheat-group"><h3>' + esc(g.title) + '</h3><div class="cheat-items">' +
        g.items.map(function (item) {
          return '<div class="cheat-item"><span>' + esc(item.name) + "</span><strong>" + esc(item.value) + "</strong></div>";
        }).join("") + "</div></section>";
    }).join("");
    return '<div class="reader-top"><button class="btn btn-outline btn-sm" type="button" data-action="backMaterials">← 返回资料库</button>' +
      '<button class="btn btn-soft btn-sm" type="button" data-action="practiceSubject" data-id="' + subjectId + '">做' + esc(s.short) + "专项练习</button></div>" +
      '<article class="reader-article card" style="--subject:' + s.color + ";--soft:" + s.soft + '">' +
      '<header class="article-head"><div class="article-tags"><span class="tag tag-soft">速查手册</span><span class="tag">' + esc(s.name) + "</span></div>" +
      "<h1>" + esc(c.title) + "</h1><p>" + esc(c.subtitle) + "。适合考前快速回顾，也适合做题时查漏补缺。</p></header>" +
      '<div class="cheat-groups">' + groups + "</div></article>" +
      '<p class="footer-note">速查表用于快速回忆，不替代系统学习。建议配合对应单元讲义使用。</p>';
  }

  /* ---------- 每日巩固 ---------- */
  function viewPractice() {
    if (ui.practice) {
      if (ui.practice.submitted) return viewPracticeResult();
      return viewPracticeQuiz();
    }
    const entry = todayEntry();
    const quiz = entry.quiz;
    const total = sum(state.practiceLog, "total");
    const correct = sum(state.practiceLog, "correct");
    const acc = total ? round(correct / total * 100) : null;
    const todayQuestions = 12;

    const scope = SUBJECTS.map(function (s) {
      const id = entry.units.find(function (uid) { return UNIT_MAP[uid] && UNIT_MAP[uid].subject === s.id; });
      const unit = id ? UNIT_MAP[id] : null;
      return '<div class="school-row" style="--subject:' + s.color + '">' +
        '<span class="subject-icon" style="width:30px;height:30px;font-size:14px">' + esc(s.icon) + "</span>" +
        "<div><strong>" + esc(s.name) + "</strong><p style=\"font-size:10.5px;color:var(--muted)\">" +
        (unit ? esc(unit.title) : "综合复习") + "</p></div>" +
        '<span class="tag">' + (unit ? QUESTIONS.filter(function (q) { return q.unit === unit.id; }).length : 0) + " 题</span>" +
        "</div>";
    }).join("");

    const subjectCards = SUBJECTS.map(function (s) {
      return '<article class="subject-card card" style="--subject:' + s.color + ";--soft:" + s.soft + '">' +
        '<div class="subject-top"><span class="subject-icon">' + esc(s.icon) + "</span>" +
        "<div><h3>" + esc(s.name) + "专项</h3><p>从本科题库随机抽 6 题</p></div></div>" +
        '<div class="subject-meta"><span>已练 <b>' + sum(state.practiceLog.filter(function (x) { return x.subject === s.id; }), "total") +
        "</b> 题</span><span>正确率 <b>" + (function () {
          const logs = state.practiceLog.filter(function (x) { return x.subject === s.id; });
          const t = sum(logs, "total");
          return t ? round(sum(logs, "correct") / t * 100) + "%" : "--";
        })() + "</b></span></div>" +
        '<button class="btn btn-sm" type="button" data-action="practiceSubject" data-id="' + s.id + '">开始专项练习</button>' +
        "</article>";
    }).join("");

    return '<section class="practice-hero card">' +
      "<div><span class=\"eyebrow\">每日巩固</span><h2>" + (quiz ? "今天已经巩固过一轮" : "用 12 道题检验今天的学习") + "</h2>" +
      "<p>题目来自今天四个知识单元，覆盖高数、英语、信息技术与软件工程专业课。提交后立即查看逐题解析，错题会自动进入错题本。</p>" +
      '<div class="practice-meta"><div><strong>' + todayQuestions + "</strong><span>今日题量</span></div>" +
      "<div><strong>约 15</strong><span>分钟</span></div>" +
      "<div><strong>" + (quiz ? quiz.correct + "/" + quiz.total : "--") + "</strong><span>今日成绩</span></div>" +
      "<div><strong>" + (acc == null ? "--" : acc + "%") + "</strong><span>累计正确率</span></div></div></div>" +
      '<button class="btn btn-primary" type="button" data-action="startDaily">' + (quiz ? "再练一轮" : "开始今日巩固") + "</button>" +
      "</section>" +
      '<div class="stat-strip">' +
      '<div class="stat-box"><span>累计答题</span><strong>' + total + "<small> 题</small></strong></div>" +
      '<div class="stat-box"><span>累计答对</span><strong>' + correct + "<small> 题</small></strong></div>" +
      '<div class="stat-box"><span>错题本</span><strong>' + state.wrongs.length + "<small> 题</small></strong></div>" +
      '<div class="stat-box"><span>今日巩固</span><strong>' + (quiz ? quiz.correct + "/" + quiz.total : "待完成") + "</strong></div>" +
      "</div>" +
      '<div class="section-head"><div><h2>今日出题范围</h2><p>每科抽取 3 题，优先覆盖当天单元</p></div></div>' +
      '<div class="card" style="padding:12px"><div class="school-list" style="margin:0">' + scope + "</div></div>" +
      '<div class="section-head"><div><h2>分科专项练习</h2><p>想单独补一科时使用，每次 6 题</p></div></div>' +
      '<div class="subject-grid">' + subjectCards + "</div>" +
      '<p class="footer-note">练习记录会用于计算各科掌握度，建议每天至少完成一次巩固。</p>';
  }

  function viewPracticeQuiz() {
    const p = ui.practice;
    const q = QUESTION_MAP[p.qids[p.index]];
    if (!q) { ui.practice = null; return viewPractice(); }
    const s = SUBJECT_MAP[q.subject];
    const answered = p.qids.filter(function (id) { return typeof p.answers[id] === "number"; }).length;
    const options = q.options.map(function (opt, i) {
      const selected = p.answers[q.id] === i;
      return '<button class="option' + (selected ? " selected" : "") + '" type="button" role="radio" aria-checked="' + selected +
        '" data-action="answer" data-qid="' + q.id + '" data-opt="' + i + '">' +
        '<span class="option-key">' + LETTERS[i] + "</span><span>" + esc(opt) + "</span></button>";
    }).join("");
    const palette = p.qids.map(function (id, i) {
      const cls = i === p.index ? " current" : (typeof p.answers[id] === "number" ? " answered" : "");
      return '<button class="palette-btn' + cls + '" type="button" data-action="practiceJump" data-index="' + i + '">' + (i + 1) + "</button>";
    }).join("");
    const isLast = p.index === p.qids.length - 1;
    return '<div class="exam-topbar"><div class="exam-title">' +
      '<strong>' + (p.mode === "daily" ? "每日巩固" : p.mode === "unit" ? "单元练习" : esc(s.name) + "专项练习") + "</strong>" +
      '<span class="tag tag-soft" style="--subject:' + s.color + '">' + esc(s.name) + " · " + esc(STAGE_MAP[q.stage].name) + "</span>" +
      '<span>已作答 ' + answered + "/" + p.qids.length + "</span></div>" +
      '<button class="btn btn-outline btn-sm" type="button" data-action="exitPractice">退出练习</button></div>' +
      '<div class="quiz-shell card">' +
      '<div class="quiz-head"><span class="quiz-index">第 ' + (p.index + 1) + " / " + p.qids.length + " 题</span>" +
      "<span>" + esc(UNIT_MAP[q.unit] ? UNIT_MAP[q.unit].title : "") + "</span></div>" +
      '<div class="quiz-progress"><span style="width:' + ((p.index + 1) / p.qids.length * 100) + '%"></span></div>' +
      '<h3 class="quiz-stem">' + esc(q.stem) + "</h3>" +
      '<div class="options" role="radiogroup" aria-label="选项">' + options + "</div>" +
      '<div class="quiz-palette">' + palette + "</div>" +
      '<div class="palette-legend"><span><i style="background:var(--brand)"></i>当前题</span><span><i style="background:var(--brand-soft);border:1px solid var(--brand)"></i>已作答</span><span><i style="background:var(--line)"></i>未作答</span></div>' +
      '<div class="quiz-actions">' +
      '<button class="btn btn-outline btn-sm" type="button" data-action="practicePrev"' + (p.index === 0 ? " disabled" : "") + ">上一题</button>" +
      '<button class="btn btn-outline btn-sm" type="button" data-action="practiceNext"' + (isLast ? " disabled" : "") + ">下一题</button>" +
      '<span class="spacer"></span>' +
      '<button class="btn btn-primary" type="button" data-action="submitPractice">提交答卷</button>' +
      "</div></div>" +
      '<p class="footer-note">选择会自动保存。提交后统一判分并展示解析，未答完无法提交。</p>';
  }

  function viewPracticeResult() {
    const p = ui.practice;
    const r = p.result;
    const pct = round(r.correct / r.total * 100);
    const color = pct >= 80 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
    const wrongUnits = {};
    r.details.forEach(function (d) {
      if (d.correct) return;
      const q = QUESTION_MAP[d.qid];
      const unit = UNIT_MAP[q.unit];
      if (unit) wrongUnits[unit.id] = unit;
    });
    const weak = Object.keys(wrongUnits).map(function (id) { return UNIT_MAP[id]; });
    const review = r.details.map(function (d, i) {
      const q = QUESTION_MAP[d.qid];
      const s = SUBJECT_MAP[q.subject];
      const chosenText = d.chosen == null ? "未作答" : LETTERS[d.chosen] + ". " + q.options[d.chosen];
      return '<div class="review-item ' + (d.correct ? "is-correct" : "is-wrong") + '">' +
        '<div class="review-head"><span>第 ' + (i + 1) + " 题 · " + esc(s.short) + " · " + esc(UNIT_MAP[q.unit] ? UNIT_MAP[q.unit].title : "") + "</span>" +
        '<span class="tag ' + (d.correct ? "tag-success" : "tag-danger") + '">' + (d.correct ? "正确" : "错误") + "</span></div>" +
        '<p class="review-stem">' + esc(q.stem) + "</p>" +
        '<div class="review-answer">你的答案：<span class="' + (d.correct ? "right-text" : "wrong-text") + '">' + esc(chosenText) +
        "</span> ｜ 正确答案：<span class=\"right-text\">" + LETTERS[q.answer] + ". " + esc(q.options[q.answer]) + "</span></div>" +
        '<div class="explain"><strong>解析：</strong>' + esc(q.explain) + "</div></div>";
    }).join("");

    return '<section class="result-hero card">' +
      '<div class="result-ring">' + ringHTML(pct, 132, color, "正确率") + "</div>" +
      '<div class="result-copy"><span class="eyebrow">巩固完成</span>' +
      "<h2>" + (p.mode === "daily" ? "每日巩固" : p.mode === "unit" ? "单元练习" : "专项练习") + " · 答对 " + r.correct + "/" + r.total + " 题</h2>" +
      "<p>" + (pct >= 80 ? "掌握得不错，保持这个节奏。" : pct >= 60 ? "基础题基本过关，建议把错题所在单元再看一遍。" : "本次暴露了不少薄弱点，先回到知识点，再做一次巩固。") + "</p>" +
      '<div class="result-metrics"><div><strong>' + pct + '%</strong><span>正确率</span></div>' +
      "<div><strong>" + r.total + "</strong><span>总题数</span></div>" +
      "<div><strong>" + r.timeUsed + "</strong><span>用时（分钟）</span></div>" +
      "<div><strong>" + state.wrongs.length + "</strong><span>错题本总数</span></div></div>" +
      (weak.length ? '<p style="font-size:11.5px;color:var(--muted);margin-top:12px">薄弱单元：' + weak.map(function (u) { return esc(u.title); }).join("、") + "</p>" : "") +
      "</div></section>" +
      '<div class="section-head"><div><h2>逐题解析</h2><p>答错的题已自动加入错题本</p></div>' +
      '<div style="display:flex;gap:8px"><button class="btn btn-outline btn-sm" type="button" data-view="analysis">查看学情</button>' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="exitPractice">返回巩固首页</button></div></div>' +
      '<div class="review-list">' + review + "</div>";
  }

  /* ---------- 阶段测验 ---------- */
  function viewExam() {
    if (ui.examResult) return viewExamResult();
    if (ui.exam) return viewExamTaking();
    return viewExamConfig();
  }

  function viewExamConfig() {
    const cfg = ui.examConfig;
    const subject = SUBJECT_MAP[cfg.subject];
    const stage = STAGE_MAP[cfg.stage];
    const subjectChoices = SUBJECTS.map(function (s) {
      return '<button class="choice' + (cfg.subject === s.id ? " active" : "") + '" type="button" data-action="examSubject" data-id="' + s.id + '" style="--subject:' + s.color + '">' +
        '<span class="choice-dot"></span><span><strong>' + esc(s.name) + "</strong><small>" + s.full + " 分 · " + unitsOf(s.id).length + " 单元</small></span></button>";
    }).join("");
    const stageChoices = STAGES.map(function (st) {
      const count = QUESTIONS.filter(function (q) { return q.subject === cfg.subject && q.stage === st.id; }).length;
      return '<button class="choice' + (cfg.stage === st.id ? " active" : "") + '" type="button" data-action="examStage" data-id="' + st.id + '">' +
        '<span class="choice-dot" style="background:' + st.color + '"></span><span><strong>' + esc(st.name) + "</strong><small>" + count + " 道题 · " + esc(st.weeks) + "</small></span></button>";
    }).join("");
    const history = state.exams.slice(-6).reverse();
    const avg = history.length ? round(state.exams.reduce(function (a, e) { return a + e.score; }, 0) / state.exams.length) : null;
    const subjectTipRows = SUBJECTS.map(function (s) {
      return '<div class="school-row" style="--subject:' + s.color + '">' +
        '<span class="subject-icon" style="width:30px;height:30px;font-size:14px">' + esc(s.icon) + "</span>" +
        "<div><strong>" + esc(s.name) + '</strong><p style="font-size:10.5px;color:var(--muted)">' + esc(s.examTip) + "</p></div>" +
        '<span class="tag">' + s.full + " 分</span></div>";
    }).join("");

    let historyHtml = "";
    if (state.exams.length) {
      historyHtml = '<div class="section-head"><div><h2>测验记录</h2><p>共 ' + state.exams.length + " 次，平均 " + avg + " 分</p></div></div>" +
        '<div class="card" style="overflow-x:auto"><table class="table"><thead><tr><th>日期</th><th>科目</th><th>阶段</th><th>得分</th><th>用时</th><th></th></tr></thead><tbody>' +
        history.map(function (e) {
          return "<tr><td>" + esc(e.date.slice(5)) + "</td><td>" + esc(SUBJECT_MAP[e.subject].short) +
            "</td><td>" + esc(STAGE_MAP[e.stage] ? STAGE_MAP[e.stage].short : e.stage) +
            '</td><td class="score">' + e.score + "</td><td>" + formatClock(e.timeUsed || 0) +
            '</td><td><button class="text-link" type="button" data-action="openExamRecord" data-id="' + esc(e.id) + '">查看解析</button></td></tr>';
        }).join("") + "</tbody></table></div>";
    }

    return '<div class="page-head"><div><h2>阶段测验</h2>' +
      "<p>按科目和阶段抽取 10 道题，限时 15 分钟，满分 100 分。建议每学完一个阶段就测一次，用成绩校准掌握度。</p></div>" +
      '<div class="day-badge"><strong>' + (avg == null ? "--" : avg) + "</strong><span>历史平均<br>得分</span></div></div>" +
      '<div class="grid grid-2">' +
      '<section class="card"><div class="chart-head"><div><h3>选择科目</h3><p>四科均可单独测验</p></div></div><div class="choice-grid">' + subjectChoices + "</div>" +
      '<div class="callout" style="margin-top:14px"><strong>提示：</strong>' + esc(subject.examTip) + "</div>" +
      '<div class="section-head" style="margin:16px 2px 8px"><div><h3 style="font-size:13px">四科测验建议</h3></div></div>' +
      '<div class="school-list" style="margin-top:0">' + subjectTipRows + "</div></section>" +
      '<section class="card"><div class="chart-head"><div><h3>选择阶段</h3><p>按学习进度选择对应难度</p></div></div><div class="choice-grid">' + stageChoices + "</div>" +
      '<div class="config-row"><span>科目</span><strong>' + esc(subject.name) + "</strong></div>" +
      '<div class="config-row"><span>阶段</span><strong>' + esc(stage.name) + "</strong></div>" +
      '<div class="config-row"><span>题量与时间</span><strong>10 题 · 15 分钟</strong></div>' +
      '<button class="btn btn-primary btn-block" type="button" data-action="startExam">开始 ' + esc(subject.short) + " · " + esc(stage.short) + "测验</button>" +
      '<p class="exam-note">交卷后立即出分并展示逐题解析，成绩会计入该科掌握度。未作答题目按错误计分。</p></section>' +
      "</div>" + historyHtml +
      '<p class="footer-note">阶段测验难度与题量参考天津专升本常见题型设置，仅用于校内自测。</p>';
  }

  function viewExamTaking() {
    const exam = ui.exam;
    const q = QUESTION_MAP[exam.qids[exam.index]];
    const s = SUBJECT_MAP[exam.subject];
    const stage = STAGE_MAP[exam.stage];
    const answered = exam.qids.filter(function (id) { return typeof exam.answers[id] === "number"; }).length;
    const left = Math.max(0, exam.duration - Math.floor((Date.now() - exam.startedAt) / 1000));
    const options = q.options.map(function (opt, i) {
      const selected = exam.answers[q.id] === i;
      return '<button class="option' + (selected ? " selected" : "") + '" type="button" role="radio" aria-checked="' + selected +
        '" data-action="answer" data-qid="' + q.id + '" data-opt="' + i + '">' +
        '<span class="option-key">' + LETTERS[i] + "</span><span>" + esc(opt) + "</span></button>";
    }).join("");
    const palette = exam.qids.map(function (id, i) {
      const cls = i === exam.index ? " current" : (typeof exam.answers[id] === "number" ? " answered" : "");
      return '<button class="palette-btn' + cls + '" type="button" data-action="examJump" data-index="' + i + '">' + (i + 1) + "</button>";
    }).join("");
    const isLast = exam.index === exam.qids.length - 1;
    return '<div class="exam-topbar"><div class="exam-title"><strong>' + esc(s.name) + " · " + esc(stage.name) + "测验</strong>" +
      '<span class="tag tag-soft" style="--subject:' + s.color + '">满分 100</span>' +
      "<span>已作答 " + answered + "/" + exam.qids.length + "</span></div>" +
      '<span class="timer' + (left <= 180 ? " warn" : "") + '" id="examTimer">' + formatClock(left) + "</span></div>" +
      '<div class="exam-layout"><section class="card exam-main">' +
      '<div class="quiz-head"><span class="quiz-index">第 ' + (exam.index + 1) + " / " + exam.qids.length + " 题</span><span>单选题 · 每题 10 分</span></div>" +
      '<div class="quiz-progress"><span style="width:' + ((exam.index + 1) / exam.qids.length * 100) + '%"></span></div>' +
      '<h3 class="quiz-stem">' + esc(q.stem) + "</h3>" +
      '<div class="options" role="radiogroup" aria-label="选项">' + options + "</div>" +
      '<div class="quiz-actions">' +
      '<button class="btn btn-outline btn-sm" type="button" data-action="examPrev"' + (exam.index === 0 ? " disabled" : "") + ">上一题</button>" +
      '<button class="btn btn-outline btn-sm" type="button" data-action="examNext"' + (isLast ? " disabled" : "") + ">下一题</button>" +
      '<span class="spacer"></span><button class="btn btn-primary" type="button" data-action="submitExam">交卷</button>' +
      "</div></section>" +
      '<aside class="card exam-side"><h3>答题卡</h3><div class="quiz-palette">' + palette + "</div>" +
      '<div class="palette-legend"><span><i style="background:var(--brand)"></i>当前</span><span><i style="background:var(--brand-soft);border:1px solid var(--brand)"></i>已答</span><span><i style="background:var(--line)"></i>未答</span></div>' +
      '<button class="btn btn-primary btn-block" type="button" data-action="submitExam">交卷并查看解析</button>' +
      '<p class="exam-note">时间到会自动交卷。离开页面计时不会暂停，建议留出完整 15 分钟。</p></aside></div>';
  }

  function viewExamResult() {
    const res = ui.examResult;
    const rec = res.record;
    const pct = round(res.score);
    const color = pct >= 80 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
    const s = SUBJECT_MAP[rec.subject];
    const stage = STAGE_MAP[rec.stage];
    const wrong = res.details.filter(function (d) { return !d.correct; });
    const wrongUnits = {};
    wrong.forEach(function (d) {
      const unit = UNIT_MAP[QUESTION_MAP[d.qid].unit];
      if (unit) wrongUnits[unit.id] = unit;
    });
    const advice = res.score >= 80
      ? "这一阶段掌握得比较扎实，可以进入下一阶段，或继续用限时卷保持手感。"
      : res.score >= 60
        ? "基本盘已经具备，建议针对错题所在单元做一次专项练习，再测一轮。"
        : "当前阶段还有明显漏洞，先回到知识单元重学，不要急着刷下一阶段。";
    const review = res.details.map(function (d, i) {
      const q = QUESTION_MAP[d.qid];
      const chosenText = d.chosen == null ? "未作答" : LETTERS[d.chosen] + ". " + q.options[d.chosen];
      return '<div class="review-item ' + (d.correct ? "is-correct" : "is-wrong") + '">' +
        '<div class="review-head"><span>第 ' + (i + 1) + " 题 · " + esc(UNIT_MAP[q.unit] ? UNIT_MAP[q.unit].title : "") + "</span>" +
        '<span class="tag ' + (d.correct ? "tag-success" : "tag-danger") + '">' + (d.correct ? "正确 +10" : "错误 0") + "</span></div>" +
        '<p class="review-stem">' + esc(q.stem) + "</p>" +
        '<div class="review-answer">你的答案：<span class="' + (d.correct ? "right-text" : "wrong-text") + '">' + esc(chosenText) +
        "</span> ｜ 正确答案：<span class=\"right-text\">" + LETTERS[q.answer] + ". " + esc(q.options[q.answer]) + "</span></div>" +
        '<div class="explain"><strong>解析：</strong>' + esc(q.explain) + "</div></div>";
    }).join("");
    return '<section class="result-hero card">' +
      '<div class="result-ring">' + ringHTML(pct, 132, color, "得分率") + "</div>" +
      '<div class="result-copy"><span class="eyebrow">' + esc(s.name) + " · " + esc(stage.name) + "测验</span>" +
      "<h2>得分 " + res.score + " / 100</h2><p>" + advice + "</p>" +
      '<div class="result-metrics"><div><strong>' + res.correct + "/" + res.total + "</strong><span>答对题数</span></div>" +
      "<div><strong>" + formatClock(res.timeUsed || 0) + "</strong><span>用时</span></div>" +
      "<div><strong>" + masteryOf(rec.subject) + "%</strong><span>该科当前掌握度</span></div>" +
      "<div><strong>" + (wrong.length ? wrong.length : 0) + "</strong><span>本次错题</span></div></div>" +
      (Object.keys(wrongUnits).length ? '<p style="font-size:11.5px;color:var(--muted);margin-top:12px">需要回看：' + Object.keys(wrongUnits).map(function (id) { return esc(UNIT_MAP[id].title); }).join("、") + "</p>" : "") +
      "</div></section>" +
      '<div class="section-head"><div><h2>逐题解析</h2><p>错题已进入错题本，可在学情分析中回看</p></div>' +
      '<div style="display:flex;gap:8px"><button class="btn btn-outline btn-sm" type="button" data-view="analysis">查看学情</button>' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="exitExamResult">返回测验首页</button></div></div>' +
      '<div class="review-list">' + review + "</div>";
  }

  /* ---------- 学情分析 ---------- */
  function trendPoints() {
    if (state.exams.length >= 2) {
      return state.exams.slice(-8).map(function (e) {
        return { label: e.date.slice(5), value: e.score };
      });
    }
    const map = {};
    state.practiceLog.forEach(function (p) {
      if (!map[p.date]) map[p.date] = { correct: 0, total: 0 };
      map[p.date].correct += p.correct;
      map[p.date].total += p.total;
    });
    const keys = Object.keys(map).sort().slice(-7);
    return keys.map(function (k) {
      return { label: k.slice(5), value: map[k].total ? round(map[k].correct / map[k].total * 100) : 0 };
    });
  }

  function viewAnalysis() {
    const school = SCHOOL_MAP[state.profile.schoolId] || SCHOOLS[0];
    const fc = forecast();
    const acc = overallAccuracy();
    const avg = state.exams.length ? round(state.exams.reduce(function (a, e) { return a + e.score; }, 0) / state.exams.length) : null;
    const total = totalCompleted();
    const points = trendPoints();
    const trendTitle = state.exams.length >= 2 ? "最近测验得分率" : "最近练习正确率";
    const trendNote = state.exams.length >= 2 ? "最近 8 次阶段测验" : "按日汇总的练习正确率";

    const masteryRows = SUBJECTS.map(function (s) {
      const st = subjectStats(s.id);
      const m = masteryOf(s.id);
      const hint = !hasEvidence(s.id)
        ? "还没有练习或测验记录，先完成一次巩固"
        : m < 45
          ? "基础还不稳，建议回看当前阶段单元"
          : m < 70
            ? "正确率有提升空间，优先复盘错题"
            : m < 85
              ? "已接近目标水平，加强综合题训练"
              : "掌握良好，保持限时训练";
      return '<div class="mastery-row" style="--subject:' + s.color + '">' +
        '<div class="mastery-top"><b>' + esc(s.name) + "</b><span>进度 " + round(completionRate(s.id) * 100) + "% · 练习 " +
        (st.practiceTotal ? round(st.practiceRate * 100) + "%" : "--") + " · 测验 " + (st.examAvg == null ? "--" : st.examAvg + "分") + "</span></div>" +
        '<div class="mastery-bar"><span style="width:' + m + '%"></span></div>' +
        '<span class="mastery-hint">掌握度 ' + m + "% · " + hint + "</span></div>";
    }).join("");

    const examCountBySubject = SUBJECTS.map(function (s) {
      return state.exams.filter(function (e) { return e.subject === s.id; }).length;
    });
    const checklist = [
      { ok: total === UNITS.length, label: "完成全部知识单元", detail: total + "/" + UNITS.length },
      { ok: examCountBySubject.every(function (n) { return n >= 1; }), label: "四科各完成至少 1 次阶段测验", detail: examCountBySubject.filter(function (n) { return n >= 1; }).length + "/4" },
      { ok: acc != null && acc >= 70, label: "综合正确率达到 70%", detail: acc == null ? "待练习" : acc + "%" },
      { ok: fc.ready && fc.total >= school.line, label: "预测总分达到 " + school.name + " 参考线", detail: fc.ready ? fc.total + "/" + school.line : "待生成" }
    ];
    const checklistHtml = checklist.map(function (c) {
      return '<div class="school-row" style="' + (c.ok ? "border-color:var(--success);" : "") + '">' +
        '<span style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:' +
        (c.ok ? "var(--success-soft);color:var(--success)" : "var(--panel-2);color:var(--muted)") + '">' +
        (c.ok ? checkSvg() : crossSvg()) + "</span>" +
        "<div><strong>" + esc(c.label) + '</strong><p style="font-size:10.5px;color:var(--muted)">' + esc(c.detail) + "</p></div></div>";
    }).join("");

    const wrongs = state.wrongs.slice().sort(function (a, b) {
      return String(b.date).localeCompare(String(a.date));
    });
    let wrongHtml = '<div class="empty"><strong>错题本是空的</strong>完成练习或测验后，答错的题会自动收录到这里。</div>';
    if (wrongs.length) {
      wrongHtml = '<div class="wrong-list">' + wrongs.slice(0, 12).map(function (w) {
        const q = QUESTION_MAP[w.qid];
        const unit = UNIT_MAP[q.unit];
        const s = SUBJECT_MAP[q.subject];
        return '<div class="wrong-item" style="border-left:3px solid ' + s.color + '">' +
          '<div class="wrong-top"><strong>' + esc(s.short) + " · " + esc(unit ? unit.title : "") + "</strong>" +
          '<span class="tag">错 ' + (w.count || 1) + " 次 · " + esc(String(w.date).slice(5)) + "</span></div>" +
          "<p>" + esc(q.stem) + "</p>" +
          '<div class="wrong-answer">正确答案：' + LETTERS[q.answer] + ". " + esc(q.options[q.answer]) + "</div>" +
          '<div class="explain"><strong>解析：</strong>' + esc(q.explain) + "</div>" +
          '<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-outline btn-sm" type="button" data-action="removeWrong" data-id="' + q.id + '">已掌握，移除</button>' +
          '<button class="btn btn-soft btn-sm" type="button" data-action="practiceSubject" data-id="' + s.id + '">再做 ' + esc(s.short) + "专项</button></div></div>";
      }).join("") + "</div>";
    }

    const history = state.exams.slice(-8).reverse();
    let historyHtml = '<div class="empty"><strong>还没有阶段测验记录</strong>去测验页完成一次阶段测验，成绩会用于校准掌握度。</div>';
    if (history.length) {
      historyHtml = '<div class="card" style="overflow-x:auto;padding:6px 0"><table class="table"><thead><tr><th>日期</th><th>科目</th><th>阶段</th><th>得分</th><th>用时</th></tr></thead><tbody>' +
        history.map(function (e) {
          return "<tr><td>" + esc(e.date.slice(5)) + "</td><td>" + esc(SUBJECT_MAP[e.subject].name) +
            "</td><td>" + esc(STAGE_MAP[e.stage] ? STAGE_MAP[e.stage].name : e.stage) +
            '</td><td class="score">' + e.score + "</td><td>" + formatClock(e.timeUsed || 0) + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }

    return '<div class="page-head"><div><h2>学情分析</h2>' +
      "<p>把学习进度、练习正确率与阶段测验成绩综合起来，判断四科短板以及离公办院校参考线还有多远。</p></div>" +
      '<div class="day-badge"><strong>' + (fc.ready ? fc.total : "--") + "</strong><span>预测总分<br>/ 650</span></div></div>" +
      '<div class="kpi-grid">' +
      '<div class="kpi card"><span class="kpi-label">已完成单元</span><strong>' + total + "<small>/" + UNITS.length + "</small></strong><span class=\"kpi-hint\">知识覆盖进度</span></div>" +
      '<div class="kpi card"><span class="kpi-label">综合正确率</span><strong>' + (acc == null ? "--" : acc) + "<small>" + (acc == null ? "" : "%") + "</small></strong><span class=\"kpi-hint\">练习与测验合计</span></div>" +
      '<div class="kpi card"><span class="kpi-label">测验平均分</span><strong>' + (avg == null ? "--" : avg) + "<small>" + (avg == null ? "" : "分") + "</small></strong><span class=\"kpi-hint\">阶段测验百分制</span></div>" +
      '<div class="kpi card"><span class="kpi-label">目标差距</span><strong>' + (fc.ready ? (fc.total >= school.line ? "+" + (fc.total - school.line) : "-" + (school.line - fc.total)) : "--") + "<small>" + (fc.ready ? "分" : "") + "</small></strong><span class=\"kpi-hint\">" + esc(school.name) + " 参考线 " + school.line + "</span></div>" +
      "</div>" +
      '<div class="chart-grid">' +
      '<section class="card chart-card"><div class="chart-head"><div><h3>四科掌握度雷达</h3><p>进度 30% + 练习 40% + 测验 30%</p></div><span class="tag">满分 100</span></div>' +
      '<div class="chart-wrap">' + radarChart() + "</div></section>" +
      '<section class="card chart-card"><div class="chart-head"><div><h3>' + trendTitle + "</h3><p>" + trendNote + "</p></div></div>" +
      (points.length ? '<div class="chart-wrap">' + lineChart(points) + "</div>" : '<div class="chart-empty">完成至少一次练习或测验后，这里会显示成绩趋势。</div>') +
      "</section></div>" +
      '<div class="section-head"><div><h2>各科掌握情况</h2><p>掌握度会随学习与测试动态变化</p></div></div>' +
      '<div class="grid grid-2"><section class="card"><div class="mastery-list">' + masteryRows + "</div></section>" +
      '<section class="card"><div class="chart-head"><div><h3>公办院校达标标准</h3><p>' + esc(school.name) + " · " + esc(school.level) + "</p></div></div>" +
      '<div class="callout" style="margin-bottom:10px">本平台建议标准：总分不低于 <strong>' + school.line + "/650</strong>，英语建议 <strong>≥60/150</strong>，软件工程专业课建议 <strong>≥120/200</strong>，且四科无明显短板。</div>" +
      '<div class="school-list">' + checklistHtml + "</div>" +
      '<p class="mastery-hint" style="margin-top:10px">' + esc(EXAM_NOTE) + "</p></section></div>" +
      '<div class="section-head"><div><h2>错题本</h2><p>共 ' + state.wrongs.length + " 题，答对后自动移出</p></div></div>" + wrongHtml +
      (state.wrongs.length > 12 ? '<p class="mastery-hint" style="margin-top:10px">仅展示最近 12 道错题，完成对应专项练习并答对后可移出。</p>' : "") +
      '<div class="section-head"><div><h2>阶段测验记录</h2><p>最近 8 次成绩</p></div></div>' + historyHtml +
      '<p class="footer-note">达标判断为学习辅助参考，不代表真实录取结果。请以官方招生政策为准。</p>';
  }

  /* ---------- 设置动作 ---------- */
  function saveSettings() {
    const nameEl = document.getElementById("setName");
    const dateEl = document.getElementById("setExamDate");
    const schoolEl = document.getElementById("setSchool");
    const minEl = document.getElementById("setMinutes");
    if (!nameEl || !dateEl || !schoolEl || !minEl) return;
    const name = nameEl.value.trim() || "同学";
    const examDate = dateEl.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(examDate)) {
      showToast("请选择有效的考试日期");
      return;
    }
    state.profile.name = name.slice(0, 16);
    state.profile.examDate = examDate;
    state.profile.schoolId = SCHOOL_MAP[schoolEl.value] ? schoolEl.value : "tjut";
    state.profile.dailyMinutes = Number(minEl.value) || 120;
    saveState();
    showToast("设置已保存");
    render();
  }

  function exportData() {
    const payload = JSON.stringify(state, null, 2);
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "jinmen-progress-" + todayKey() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("学习数据已导出");
  }

  function importDataFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || typeof parsed !== "object" || !parsed.profile || !parsed.completed) {
          showToast("文件格式不正确，需要本平台导出的 JSON");
          return;
        }
        if (!window.confirm("导入将覆盖当前学习数据，确定继续吗？")) return;
        state = normalizeState(parsed);
        saveState();
        applyTheme();
        ui.practice = null;
        ui.exam = null;
        ui.examResult = null;
        render();
        showToast("数据导入成功");
      } catch (err) {
        showToast("读取失败，请确认文件是有效的 JSON");
      }
    };
    reader.readAsText(file);
  }

  function resetData() {
    if (!window.confirm("确定要清空全部学习数据吗？此操作不可恢复。")) return;
    if (!window.confirm("再次确认：进度、测验和错题都会删除，建议先导出备份。")) return;
    state = defaultState();
    saveState();
    ui.practice = null;
    ui.exam = null;
    ui.examResult = null;
    applyTheme();
    render();
    showToast("已重置，重新开始吧");
  }

  /* ---------- 渲染入口 ---------- */
  function render() {
    clearInterval(examTimerId);
    applyTheme();
    if (!VIEW_TITLES[ui.view]) ui.view = "dashboard";
    renderChrome();
    const view = document.getElementById("view");
    if (!view) return;
    let html = "";
    switch (ui.view) {
      case "today": html = viewToday(); break;
      case "materials": html = viewMaterials(); break;
      case "practice": html = viewPractice(); break;
      case "exam": html = viewExam(); break;
      case "analysis": html = viewAnalysis(); break;
      case "settings": html = viewSettings(); break;
      default: html = viewDashboard(); break;
    }
    view.innerHTML = html;
    if (ui.view === "exam" && ui.exam) startExamTimer();
  }

  function buildBottomNav() {
    const bottom = document.getElementById("bottomNav");
    const nav = document.getElementById("nav");
    if (!bottom || !nav) return;
    const items = nav.querySelectorAll(".nav-item");
    bottom.innerHTML = Array.prototype.map.call(items, function (item) {
      return '<button type="button" data-view="' + item.dataset.view + '">' +
        item.querySelector("svg").outerHTML + "<span>" + item.querySelector("span").textContent + "</span></button>";
    }).join("");
  }

  /* ---------- 事件绑定 ---------- */
  function applyMaterialSearch() {
    const input = document.getElementById("materialSearchInput");
    ui.materialsQuery = input ? input.value.trim() : "";
    render();
    const next = document.getElementById("materialSearchInput");
    if (next) {
      next.focus();
      try { next.setSelectionRange(next.value.length, next.value.length); } catch (err) {}
    }
  }

  function handleViewClick(e) {
    const target = e.target.closest("[data-action]");
    if (target) {
      const action = target.dataset.action;
      if (action === "answer") {
        const qid = target.dataset.qid;
        const opt = Number(target.dataset.opt);
        if (ui.practice && !ui.practice.submitted) {
          ui.practice.answers[qid] = opt;
          render();
        } else if (ui.exam) {
          ui.exam.answers[qid] = opt;
          render();
        }
        return;
      }
      if (action === "practiceJump") {
        if (!ui.practice) return;
        ui.practice.index = Number(target.dataset.index);
        render();
        return;
      }
      if (action === "practicePrev" && ui.practice) {
        ui.practice.index = Math.max(0, ui.practice.index - 1);
        render();
        return;
      }
      if (action === "practiceNext" && ui.practice) {
        ui.practice.index = Math.min(ui.practice.qids.length - 1, ui.practice.index + 1);
        render();
        return;
      }
      if (action === "submitPractice") {
        submitPractice();
        return;
      }
      if (action === "exitPractice") {
        if (ui.practice && !ui.practice.submitted) {
          const answered = Object.keys(ui.practice.answers).length;
          if (answered && !window.confirm("退出后本次作答不会保存，确定退出吗？")) return;
        }
        ui.practice = null;
        render();
        return;
      }
      if (action === "openMaterial") {
        openMaterial(target.dataset.id);
        return;
      }
      if (action === "backMaterials") {
        ui.readingUnit = null;
        ui.cheatsheet = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      if (action === "toggleMaterialRead") {
        toggleMaterialRead(target.dataset.id);
        return;
      }
      if (action === "filterMaterials") {
        ui.materialsSubject = target.dataset.id === "all" || SUBJECT_MAP[target.dataset.id] ? target.dataset.id : "all";
        render();
        return;
      }
      if (action === "applyMaterialSearch") {
        applyMaterialSearch();
        return;
      }
      if (action === "clearMaterialSearch") {
        ui.materialsQuery = "";
        render();
        return;
      }
      if (action === "openCheatsheet") {
        if (CHEATSHEETS[target.dataset.id]) {
          ui.cheatsheet = target.dataset.id;
          ui.readingUnit = null;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
        return;
      }
      if (action === "startDaily") {
        startPractice("daily");
        return;
      }
      if (action === "practiceSubject") {
        startPractice("subject", { subjectId: target.dataset.id });
        return;
      }
      if (action === "practiceUnit") {
        startPractice("unit", { unitId: target.dataset.id });
        return;
      }
      if (action === "completeUnit") {
        completeUnit(target.dataset.id);
        return;
      }
      if (action === "examSubject") {
        ui.examConfig.subject = target.dataset.id;
        ui.examResult = null;
        render();
        return;
      }
      if (action === "examStage") {
        ui.examConfig.stage = target.dataset.id;
        ui.examResult = null;
        render();
        return;
      }
      if (action === "startExam") {
        startExam();
        return;
      }
      if (action === "examJump" && ui.exam) {
        ui.exam.index = Number(target.dataset.index);
        render();
        return;
      }
      if (action === "examPrev" && ui.exam) {
        ui.exam.index = Math.max(0, ui.exam.index - 1);
        render();
        return;
      }
      if (action === "examNext" && ui.exam) {
        ui.exam.index = Math.min(ui.exam.qids.length - 1, ui.exam.index + 1);
        render();
        return;
      }
      if (action === "submitExam") {
        submitExam(false);
        return;
      }
      if (action === "exitExamResult") {
        ui.examResult = null;
        render();
        return;
      }
      if (action === "openExamRecord") {
        openExamRecord(target.dataset.id);
        return;
      }
      if (action === "saveSettings") {
        saveSettings();
        return;
      }
      if (action === "selectSchool") {
        const id = target.dataset.id;
        if (SCHOOL_MAP[id]) {
          state.profile.schoolId = id;
          saveState();
          showToast("目标院校已切换为" + SCHOOL_MAP[id].name);
          render();
        }
        return;
      }
      if (action === "exportData") {
        exportData();
        return;
      }
      if (action === "importData") {
        const input = document.getElementById("importFile");
        if (input) input.click();
        return;
      }
      if (action === "resetData") {
        resetData();
        return;
      }
      if (action === "removeWrong") {
        const idx = state.wrongs.findIndex(function (w) { return w.qid === target.dataset.id; });
        if (idx !== -1) {
          state.wrongs.splice(idx, 1);
          saveState();
          showToast("已从错题本移除");
          render();
        }
        return;
      }
    }

    const navTarget = e.target.closest("[data-view]");
    if (navTarget && VIEW_TITLES[navTarget.dataset.view]) {
      navigate(navTarget.dataset.view);
    }
  }

  function init() {
    const hash = (location.hash || "#dashboard").replace("#", "");
    ui.view = VIEW_TITLES[hash] ? hash : "dashboard";
    buildBottomNav();
    applyTheme();
    todayEntry();

    document.getElementById("nav").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-view]");
      if (btn) navigate(btn.dataset.view);
    });
    document.getElementById("bottomNav").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-view]");
      if (btn) navigate(btn.dataset.view);
    });
    document.getElementById("view").addEventListener("click", handleViewClick);
    document.getElementById("view").addEventListener("change", function (e) {
      if (e.target && e.target.id === "importFile") importDataFile(e.target.files[0]);
    });
    document.getElementById("view").addEventListener("keydown", function (e) {
      if (e.target && e.target.id === "materialSearchInput" && e.key === "Enter") {
        e.preventDefault();
        applyMaterialSearch();
      }
    });
    document.getElementById("themeBtn").addEventListener("click", function () {
      state.profile.theme = state.profile.theme === "dark" ? "light" : "dark";
      saveState();
      applyTheme();
      showToast(state.profile.theme === "dark" ? "已切换深色模式" : "已切换浅色模式");
    });
    window.addEventListener("hashchange", function () {
      const next = (location.hash || "#dashboard").replace("#", "");
      ui.view = VIEW_TITLES[next] ? next : "dashboard";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        todayEntry();
        render();
      }
    });
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
  </script>
</body>
</html>
